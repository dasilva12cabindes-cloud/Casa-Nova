<!DOCTYPE html>
<html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mensagens - Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabase.js"></script>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f1f3f6;padding:12px}
.topo{background:#0b5ed7;color:#fff;padding:12px;border-radius:10px;display:flex;justify-content:space-between;align-items:center}
.topo a{color:#fff;text-decoration:none;font-weight:700}
.caixa{background:#fff;border-radius:12px;padding:12px;margin-top:12px}
.cli{padding:14px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center;background:#fff;gap:8px}
.cli .nome{font-weight:700;font-size:16px;cursor:pointer;flex:1}
.cli .abrir{color:#0b5ed7;font-weight:800;cursor:pointer}
.btn-x{background:#dc2626;color:#fff;border:0;width:38px;height:38px;border-radius:50%;font-size:16px;font-weight:900;cursor:pointer}
#telaChat{display:none}
#chat{height:60vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:10px 0}
.msg{max-width:80%;padding:10px 12px;border-radius:12px;font-size:15px}
.eu{background:#0b5ed7;color:#fff;align-self:flex-end}
.outro{background:#e5e7eb;align-self:flex-start}
.enviar{display:flex;gap:8px;margin-top:10px}
.enviar input{flex:1;padding:12px;border:1px solid #ccc;border-radius:10px;font-size:15px}
.enviar button{background:#0b5ed7;color:#fff;border:0;padding:12px 16px;border-radius:10px;font-weight:700}
.btn-del{background:#dc2626;color:#fff;border:0;padding:12px;border-radius:10px;font-weight:700;width:100%;margin-top:10px}
.btn-voltar{background:#eee;border:0;padding:10px 14px;border-radius:10px;font-weight:800;cursor:pointer}
#toastMsg{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#16a34a;color:#fff;padding:12px 16px;border-radius:12px;font-weight:800;display:none;z-index:9999}
</style></head><body>
<div id="toastMsg">💬 Nova mensagem de cliente!</div>
<div class="topo"><a href="admin.html">← Voltar</a><b>💬 Mensagens</b><span id="totalMsg" style="background:#dc2626;padding:4px 10px;border-radius:999px;font-size:13px;display:none">0</span></div>

<div id="telaLista" class="caixa">
  <h3 style="margin:0 0 10px">Clientes que conversaram 👇<br><small style="color:#666;font-weight:400">Clica no nome para abrir • Clica no ❌ para apagar</small></h3>
  <div id="listaCli"><p>A carregar...</p></div>
  <button onclick="carregarLista()" style="width:100%;padding:12px;margin-top:10px;background:#0b5ed7;color:#fff;border:0;border-radius:10px;font-weight:800">🔄 Atualizar lista</button>
</div>

<div id="telaChat" class="caixa">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <button class="btn-voltar" onclick="voltarLista()">← Voltar</button>
    <b id="nomeCli">Cliente</b>
    <span></span>
  </div>
  <div id="chat"></div>
  <div class="enviar"><input id="texto" placeholder="Responder..."><button onclick="enviar()">Enviar</button></div>
  <button class="btn-del" onclick="apagarConversa()">🗑️ Apagar TODA conversa deste cliente</button>
</div>

<script>
let atual = null;
let atualNome = '';
let ultimoTotal = 0;

function formatarNome(nomeCompleto){
  if(!nomeCompleto || nomeCompleto=='Cliente') return 'Cliente';
  let partes = nomeCompleto.trim().split(/\s+/);
  if(partes.length===1) return partes[0];
  return partes[0] + ' ' + partes[1].charAt(0).toUpperCase() + '.';
}

async function carregarLista(){
  let r = await db.from('mensagens').select('cliente_id,cliente_nome').order('id',{ascending:false});
  if(r.error){ document.getElementById('listaCli').innerHTML = '<p style="color:red">Erro: '+r.error.message+'</p>'; return; }
  let unicos = [];
  (r.data||[]).forEach(m=>{
    if(!unicos.find(u=>String(u.cliente_id)==String(m.cliente_id))) unicos.push(m);
  });
  let badge = document.getElementById('totalMsg');
  if(unicos.length>0){ badge.style.display='block'; badge.textContent = unicos.length + ' conversas'; } else badge.style.display='none';
  if(unicos.length===0){ document.getElementById('listaCli').innerHTML='<p style="color:#16a34a;font-weight:700">✅ Nenhuma conversa. Lista limpa!</p>'; return; }
  document.getElementById('listaCli').innerHTML = unicos.map(u=>{
    let bonito = formatarNome(u.cliente_nome||'Cliente');
    let idSeguro = String(u.cliente_id).replace(/'/g,'');
    return `<div class="cli">
      <span class="nome" onclick="abrir('${idSeguro}','${(u.cliente_nome||'Cliente').replace(/'/g,'')}')">👤 ${bonito}</span>
      <span class="abrir" onclick="abrir('${idSeguro}','${(u.cliente_nome||'Cliente').replace(/'/g,'')}')">ABRIR →</span>
      <button class="btn-x" onclick="apagarDaLista('${idSeguro}','${bonito}')">✕</button>
    </div>`;
  }).join('');
}

// 👇 APAGAR FORÇADO: busca os IDs reais e apaga um por um!
async function apagarDaLista(id, nome){
  if(!confirm('Apagar a conversa de '+nome+'?')) return;
  // 1. Busca todas as mensagens desse cliente
  let busca = await db.from('mensagens').select('id').eq('cliente_id', String(id));
  let lista = busca.data || [];
  // Se não achou como texto, tenta como número
  if(lista.length===0 && !isNaN(Number(id))){
    busca = await db.from('mensagens').select('id').eq('cliente_id', Number(id));
    lista = busca.data || [];
  }
  if(lista.length===0){
    alert('Não achei mensagens para apagar. ID: '+id+'\nVai no Supabase > Table Editor > mensagens e apaga manualmente a linha.');
    return;
  }
  let ids = lista.map(m=>m.id);
  let r = await db.from('mensagens').delete().in('id', ids);
  if(r.error){ alert('❌ Erro: '+r.error.message); return; }
  alert('✅ Apagado! Foram '+ids.length+' mensagens.');
  // Força recarregar depois de 500ms
  setTimeout(carregarLista, 500);
}

function abrir(id,nome){
  atual = String(id);
  atualNome = nome;
  document.getElementById('nomeCli').textContent = '💬 ' + formatarNome(nome);
  document.getElementById('telaLista').style.display='none';
  document.getElementById('telaChat').style.display='block';
  ultimoTotal = 0;
  carregarChat();
}

function voltarLista(){
  atual = null;
  document.getElementById('telaChat').style.display='none';
  document.getElementById('telaLista').style.display='block';
  carregarLista();
}

async function carregarChat(){
  if(!atual) return;
  let r = await db.from('mensagens').select('*').eq('cliente_id', String(atual)).order('id',{ascending:true});
  if(!r.data || r.data.length===0 && !isNaN(Number(atual))){
    r = await db.from('mensagens').select('*').eq('cliente_id', Number(atual)).order('id',{ascending:true});
  }
  if(r.error){ document.getElementById('chat').innerHTML='<p style="color:red">Erro: '+r.error.message+'</p>'; return; }
  let msgs = r.data || [];
  let chat = document.getElementById('chat');
  if(msgs.length===0){ chat.innerHTML='<p style="color:#888;text-align:center">Sem mensagens - conversa vazia.<br>Volta e clica no ❌ para apagar da lista.</p>'; }
  else {
    chat.innerHTML = msgs.map(m=>`<div class="msg ${m.remetente=='admin'?'eu':'outro'}">${m.texto}<br><small style="opacity:.7;font-size:11px">${new Date(m.created_at).toLocaleString('pt-PT')}</small></div>`).join('');
    chat.scrollTop = chat.scrollHeight;
  }
  ultimoTotal = msgs.length;
}

async function enviar(){
  if(!atual) return alert('Escolhe um cliente primeiro!');
  let t = document.getElementById('texto').value.trim(); if(!t) return;
  document.getElementById('texto').value='';
  let r = await db.from('mensagens').insert({cliente_id: String(atual), cliente_nome: atualNome, remetente:'admin', texto:t});
  if(r.error) alert('Erro: '+r.error.message);
  carregarChat();
}

async function apagarConversa(){
  if(!atual) return;
  await apagarDaLista(atual, formatarNome(atualNome));
  voltarLista();
}

carregarLista();
setInterval(()=>{ if(atual) carregarChat(); }, 2500);
</script></body></html>
