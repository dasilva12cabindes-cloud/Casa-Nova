<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quem Está Online - Casa Nova</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabase.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
  body{background:#f1f3f6;padding:14px;padding-bottom:40px}
  .topo{background:linear-gradient(135deg,#111827,#1f2937,#374151);color:white;padding:20px 18px;border-radius:20px;border:2px solid #000;box-shadow:0 8px 20px rgba(0,0,0,.18);margin-bottom:14px;position:relative;overflow:hidden}
  .topo::after{content:"👀";position:absolute;right:14px;top:10px;font-size:46px;opacity:.25}
  .topo h1{font-size:23px;line-height:1.2}
  .topo p{font-size:13px;opacity:.8;margin-top:4px}
  .stats{display:flex;gap:8px;margin-top:14px}
  .stat{flex:1;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:14px;padding:10px;text-align:center}
  .stat b{font-size:22px;display:block}
  .stat span{font-size:11px;opacity:.9}
  .btn-atualizar{width:100%;padding:14px;border:none;border-radius:14px;background:#2563eb;color:white;font-size:15px;font-weight:800;border:2px solid #1e40af;box-shadow:0 4px 0 #1e40af;cursor:pointer;margin-bottom:18px}
  .btn-atualizar:active{transform:translateY(2px);box-shadow:0 2px 0 #1e40af}
  h2{font-size:19px;margin:18px 2px 10px;display:flex;align-items:center;gap:8px}
  .dot{width:16px;height:16px;border-radius:50%;display:inline-block;border:2px solid #fff;box-shadow:0 0 0 1px #ddd}
  .dot.green{background:#22c55e;box-shadow:0 0 10px #22c55e}
  .dot.red{background:#ef4444}
  .dot.gray{background:#cbd5e1}
  .card{background:white;border-radius:18px;padding:14px;border:2px solid #e5e7eb;border-left:6px solid #22c55e;box-shadow:0 4px 14px rgba(0,0,0,.07);margin-bottom:12px;display:flex;gap:12px;align-items:center}
  .card.saiu{border-left-color:#ef4444}
  .card.off{border-left-color:#cbd5e1;opacity:.9}
  .avatar{width:52px;height:52px;border-radius:50%;background:#111827;color:white;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;flex-shrink:0;border:2px solid #fff;box-shadow:0 0 0 2px #111827}
  .card.saiu .avatar{background:#ef4444;box-shadow:0 0 0 2px #ef4444}
  .card.off .avatar{background:#94a3b8;box-shadow:0 0 0 2px #94a3b8}
  .info{flex:1;min-width:0}
  .info b{font-size:16px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .info span{font-size:13px;color:#475569;display:block;margin-top:2px}
  .badge{display:inline-block;font-size:11px;font-weight:800;padding:4px 8px;border-radius:20px;margin-top:6px;border:1px solid #bbf7d0;background:#f0fdf4;color:#15803d}
  .badge.red{background:#fef2f2;color:#b91c1c;border-color:#fecaca}
  .badge.gray{background:#f8fafc;color:#64748b;border-color:#e2e8f0}
  .btn-wa{display:inline-block;margin-top:8px;background:#25D366;color:white;text-decoration:none;font-size:12px;font-weight:800;padding:8px 12px;border-radius:20px;border:2px solid #16a34a;box-shadow:0 2px 0 #16a34a}
  .vazio{background:white;border:2px dashed #cbd5e1;border-radius:16px;padding:16px;text-align:center;color:#64748b;font-size:14px}
  .footer{text-align:center;font-size:11px;color:#94a3b8;margin-top:20px}
</style>
</head>
<body>

<div class="topo">
  <h1>👀 Quem Está na Loja</h1>
  <p>Casa Nova • Atualização em tempo real</p>
  <div class="stats">
    <div class="stat"><b id="nOnline">0</b><span>🟢 Online Agora</span></div>
    <div class="stat"><b id="nSairam">0</b><span>🔴 Já Saíram</span></div>
  </div>
</div>

<button class="btn-atualizar" onclick="carregar()">🔄 Atualizar Agora</button>

<h2><span class="dot green"></span> Online Agora</h2>
<div id="online"></div>

<h2><span class="dot red"></span> Saiu Recentemente</h2>
<div id="sairam"></div>

<h2><span class="dot gray"></span> Todos os Visitantes de Hoje</h2>
<div id="off"></div>

<div class="footer">Casa Nova • Painel do Admin • Atualiza a cada 10s</div>

<script>
async function carregar(){
  try{
    // Usa o mesmo 'db' do teu index.html - já está configurado em js/supabase.js
    const {data: pres, error} = await db.from('presenca').select('*').order('ultima_vez',{ascending:false}).limit(100);
    if(error) throw error;

    const agora = new Date();
    let on=[], saiu=[];
    (pres||[]).forEach(p=>{
      const ult = p.ultima_vez ? new Date(p.ultima_vez) : null;
      const diffSeg = ult ? (agora - ult)/1000 : 99999;
      // Online = online=true E atualizou nos últimos 60s (o index atualiza a cada 15s)
      if(p.online === true && diffSeg < 60) on.push(p);
      else saiu.push(p);
    });

    document.getElementById('nOnline').textContent = on.length;
    document.getElementById('nSairam').textContent = saiu.length;

    const horaBonita = (d)=> d ? new Date(d).toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'}) : '';

    document.getElementById('online').innerHTML = on.length ? on.map(p=>{
      const nome = p.nome || 'Visitante';
      const tel = String(p.telefone||'').replace(/\D/g,'').slice(-9);
      return `<div class="card">
        <div class="avatar">${nome.charAt(0).toUpperCase()}</div>
        <div class="info">
          <b>${nome}</b>
          <span>📱 ${p.telefone||'Sem telefone'}</span>
          <span>📍 Está em: ${p.pagina||'Loja Principal'}</span>
          <span>🕐 Ativo há pouco: ${horaBonita(p.ultima_vez)}</span>
          <span class="badge">● ONLINE AGORA</span><br>
          ${tel ? `<a class="btn-wa" href="https://wa.me/244${tel}" target="_blank">💬 Falar no WhatsApp</a>` : ''}
        </div>
      </div>`;
    }).join('') : '<div class="vazio">Ninguém online agora.<br>Abre a loja noutro telefone para testar.</div>';

    document.getElementById('sairam').innerHTML = saiu.length ? saiu.slice(0,20).map(p=>{
      const nome = p.nome || 'Visitante';
      return `<div class="card saiu">
        <div class="avatar">${nome.charAt(0).toUpperCase()}</div>
        <div class="info">
          <b>${nome}</b>
          <span>📱 ${p.telefone||'Sem telefone'}</span>
          <span>📍 Estava em: ${p.pagina||'Loja Principal'}</span>
          <span>🕐 Última vez: ${horaBonita(p.saiu_em || p.ultima_vez)}</span>
          <span class="badge red">SAIU</span>
        </div>
      </div>`;
    }).join('') : '<div class="vazio">Ninguém saiu ainda.</div>';

    document.getElementById('off').innerHTML = (pres||[]).length ? (pres||[]).slice(0,20).map(p=>{
      const nome = p.nome || 'Visitante';
      const estaOn = on.includes(p);
      return `<div class="card ${estaOn ? '' : 'off'}">
        <div class="avatar">${nome.charAt(0).toUpperCase()}</div>
        <div class="info">
          <b>${nome}</b>
          <span>📱 ${p.telefone||'Sem telefone'}</span>
          <span>📍 Última página: ${p.pagina||'Loja Principal'}</span>
          <span class="badge ${estaOn ? '' : 'gray'}">${estaOn ? '● ONLINE' : 'OFFLINE'}</span>
        </div>
      </div>`;
    }).join('') : '<div class="vazio">Ainda ninguém visitou hoje.</div>';

  }catch(e){
    document.getElementById('online').innerHTML = '<div class="vazio">Erro: '+e.message+'</div>';
  }
}
carregar();
setInterval(carregar, 10000);
</script>
</body>
</html>
