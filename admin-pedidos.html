<!DOCTYPE html>
<html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pedidos - Casa Nova</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabase.js"></script>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f1f3f6;padding:12px}
.topo{background:#0b5ed7;color:#fff;padding:8px 12px;border-radius:10px;display:flex;justify-content:space-between;align-items:center;height:72px}
.topo .logo{display:flex;align-items:center;gap:8px}
.topo .logo-img{height:56px;width:auto;max-width:200px;object-fit:contain;background:transparent;border-radius:0;padding:0;display:none}
.topo.tem-logo .logo-text{display:none}
.topo a{color:#fff;text-decoration:none;font-weight:700}
.caixa{background:#fff;padding:14px;border-radius:12px;margin-top:12px}
.btn{border:0;padding:11px;border-radius:8px;width:100%;font-weight:700;cursor:pointer}
.btn-azul{background:#0b5ed7;color:#fff}
.btn-verde{background:#16a34a;color:#fff}
.btn-laranja{background:#f59e0b;color:#111}
.btn-cinza{background:#e5e7eb;color:#111}
select{padding:10px;border:1px solid #cfd5df;border-radius:8px;width:100%;font-size:15px}
.card-pedido{background:#fff;padding:14px;border-radius:12px;margin-top:10px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700}
.badge-novo{background:#dbeafe;color:#1e40af}
.badge-aceite{background:#fef3c7;color:#92400e}
.badge-entregue{background:#dcfce7;color:#166534}
.badge-cancelado{background:#fee2e2;color:#991b1b}
#toast{position:fixed;top:12px;left:50%;transform:translateX(-50%) translateY(-80px);background:#111827;color:#fff;padding:14px 18px;border-radius:14px;z-index:9999;font-weight:700;max-width:92%;text-align:center;transition:.35s;opacity:0;pointer-events:none}
#toast.mostrar{transform:translateX(-50%) translateY(0);opacity:1}
#toast.sucesso{background:#16a34a}
#toast.erro{background:#dc2626}
</style></head>
<body>
<div id="toast"></div>
<div class="topo" id="topoSite"><div class="logo"><img id="logoTopo" class="logo-img" src=""><span class="logo-text"><b>Casa Nova</b></span></div><a href="admin.html">← Voltar</a></div>

<div class="caixa">
<h3>📦 Pedidos Recebidos</h3>
<p style="color:#666;font-size:13px">Aqui aparecem todos os pedidos que os clientes fazem no carrinho.</p>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
<button class="btn btn-verde" onclick="location.href='admin-vendas.html'">💰 Ver Vendas do Dia →</button>
<button class="btn btn-azul" onclick="carregar()">🔄 Atualizar</button>
</div>
</div>

<div id="lista"><p style="text-align:center;color:#888">A carregar pedidos...</p></div>

<script>
let toastTimer;
function aviso(msg,tipo){let t=document.getElementById('toast');t.textContent=msg;t.className='mostrar '+(tipo||'sucesso');clearTimeout(toastTimer);toastTimer=setTimeout(()=>{t.className='';},3000);}
async function carregarLogoTopo(){
  try{let r=await db.from('loja_config').select('logo_url').eq('id',1).maybeSingle();let logo=r.data?.logo_url;if(logo){let img=document.getElementById('logoTopo');img.src=logo;img.style.display='block';document.getElementById('topoSite').classList.add('tem-logo');}}catch(e){}
}
function badge(status){
  let s=(status||'Novo').toLowerCase();
  if(s.includes('entregue')) return '<span class="badge badge-entregue">✅ Entregue</span>';
  if(s.includes('aceite')||s.includes('confirmado')||s.includes('prepar')) return '<span class="badge badge-aceite">🟡 '+status+'</span>';
  if(s.includes('cancel')) return '<span class="badge badge-cancelado">❌ Cancelado</span>';
  return '<span class="badge badge-novo">🆕 Novo</span>';
}
async function carregar(){
  let lista=[]; let tabela='pedidos';
  let r=await db.from('pedidos').select('*').order('created_at',{ascending:false});
  if(r.error){
    let r2=await db.from('encomendas').select('*').order('created_at',{ascending:false});
    if(!r2.error){ lista=r2.data||[]; tabela='encomendas'; }
    else { document.getElementById('lista').innerHTML='<div class="caixa" style="text-align:center">Ainda não tens pedidos.<br><small style="color:#888">Quando um cliente fizer pedido no carrinho, aparece aqui.</small></div>'; return; }
  } else lista=r.data||[];

  if(!lista.length){ document.getElementById('lista').innerHTML='<div class="caixa" style="text-align:center">Nenhum pedido ainda.</div>'; return; }

  document.getElementById('lista').innerHTML=lista.map(p=>{
    let nome=p.nome_cliente||p.cliente_nome||p.nome||'Cliente';
    let tel=p.telefone||p.whatsapp||'';
    let morada=p.morada||p.endereco||p.localizacao||'';
    let valor=Number(p.total||p.valor_total||p.preco_total||0).toLocaleString();
    let status=p.status||p.estado||'Novo';
    let data=(p.created_at||'').slice(0,10).split('-').reverse().join('/')+' '+(p.created_at||'').slice(11,16);
    let itens='';
    try{
      let it=p.itens||p.produtos||p.items||p.detalhes;
      if(typeof it==='string') it=JSON.parse(it);
      if(Array.isArray(it)) itens=it.map(i=>`• ${i.nome||i.produto||'Produto'} x${i.qtd||i.quantidade||1}`).join('<br>');
      else if(it) itens=it;
    }catch(e){}
    let waMsg=encodeURIComponent('Olá '+nome+', recebemos o teu pedido na Casa Nova de '+valor+' Kz. Obrigado!');
    return `<div class="card-pedido">
      <div style="display:flex;justify-content:space-between"><b>${nome}</b>${badge(status)}</div>
      <div style="color:#666;font-size:13px;margin:4px 0">${data} • ${tel}<br>${morada}</div>
      <div style="font-size:14px">${itens}</div>
      <div style="font-weight:800;color:#0b5ed7;margin:8px 0">Total: ${valor} Kz</div>
      <select onchange="mudarStatus(${p.id},this.value,'${tabela}')">
        <option value="Novo" ${status==='Novo'?'selected':''}>🆕 Novo</option>
        <option value="Aceite" ${status==='Aceite'?'selected':''}>🟡 Aceite / A Preparar</option>
        <option value="Entregue" ${status==='Entregue'?'selected':''}>✅ Entregue</option>
        <option value="Cancelado" ${status==='Cancelado'?'selected':''}>❌ Cancelado</option>
      </select>
      <button class="btn btn-verde" style="margin-top:8px" onclick="window.open('https://wa.me/${String(tel||'').replace(/[^0-9]/g,'')}?text=${waMsg}','_blank')">💬 Falar no WhatsApp</button>
    </div>`;
  }).join('');
}
async function mudarStatus(id,status,tabela){
  // CORRIGIDO: tenta só UMA coluna de cada vez
  // 1º tenta 'status'
  let r = await db.from(tabela).update({status: status}).eq('id', id);
  if(!r.error){ aviso('✅ Pedido atualizado para: '+status); carregar(); return; }
  // 2º se 'status' não existe, tenta 'estado'
  if(r.error.message.includes('status') || r.error.message.includes('column')){
    let r2 = await db.from(tabela).update({estado: status}).eq('id', id);
    if(!r2.error){ aviso('✅ Pedido atualizado para: '+status); carregar(); return; }
    // 3º se nenhuma existe, avisa para criar a coluna
    return aviso('❌ Falta a coluna status/estado na tabela '+tabela+'. Vai ao Supabase > SQL e corre: ALTER TABLE '+tabela+' ADD COLUMN status TEXT DEFAULT \'Novo\';','erro');
  }
  return aviso('❌ '+r.error.message,'erro');
}
carregarLogoTopo(); carregar();
</script></body></html>
