<!DOCTYPE html>
<html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pedidos - Casa Nova - ADMIN</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabase.js"></script>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f1f3f6;padding:12px}
.topo{background:#0b5ed7;color:#fff;padding:8px 12px;border-radius:10px;display:flex;justify-content:space-between;align-items:center;height:72px}
.topo a{color:#fff;text-decoration:none;font-weight:700}
.caixa{background:#fff;padding:14px;border-radius:12px;margin-top:12px}
.caixa h3{background:#eff6ff;border:2px solid #0b5ed7;border-radius:999px;padding:10px 14px;text-align:center;margin:0 0 8px}
.btn{border:0;padding:12px;border-radius:8px;width:100%;font-weight:700;cursor:pointer;font-size:14px}
.btn-azul{background:#0b5ed7;color:#fff}.btn-verde{background:#16a34a;color:#fff}.btn-laranja{background:#f59e0b;color:#111}.btn-cinza{background:#e5e7eb;color:#111}.btn-vermelho{background:#dc2626;color:#fff}
.card-pedido{background:#fff;padding:14px;border-radius:12px;margin-top:10px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700}
.badge-novo{background:#dbeafe;color:#1e40af}.badge-recebido{background:#e0e7ff;color:#3730a3}.badge-aceite{background:#fef3c7;color:#92400e}.badge-entregue{background:#dcfce7;color:#166534}.badge-cancelado{background:#fee2e2;color:#991b1b}
#toast{position:fixed;top:12px;left:50%;transform:translateX(-50%) translateY(-80px);background:#111827;color:#fff;padding:14px 18px;border-radius:14px;z-index:9999;font-weight:700;max-width:92%;text-align:center;transition:.35s;opacity:0;pointer-events:none}
#toast.mostrar{transform:translateX(-50%) translateY(0);opacity:1}#toast.sucesso{background:#16a34a}#toast.erro{background:#dc2626}
.modal-fundo{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:5000;display:none;align-items:center;justify-content:center;padding:20px}
.modal-fundo.aberto{display:flex}.modal-box{background:#fff;width:100%;max-width:380px;border-radius:20px;padding:22px;text-align:center;max-height:90vh;overflow-y:auto}
.modal-box input{width:100%;padding:14px;border:2px solid #0b5ed7;border-radius:10px;margin:12px 0;font-size:18px;text-align:center;font-weight:800;letter-spacing:2px;text-transform:uppercase}
.modal-fatura{padding:10px}.modal-fatura .modal-box{max-width:420px;padding:0;overflow:hidden;display:flex;flex-direction:column;max-height:92vh}
.fatura-topo{position:sticky;top:0;z-index:10;background:#111;color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
.fatura-topo button{background:#fff;color:#111;border:0;width:36px;height:36px;border-radius:50%;font-size:18px;font-weight:900;cursor:pointer}
.fatura-conteudo{overflow-y:auto;flex:1}.fatura-rodape{position:sticky;bottom:0;background:#fff;padding:12px;display:flex;gap:8px;border-top:1px solid #eee}
</style></head>
<body>
<div id="toast"></div>
<style>@keyframes flutuar{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px) scale(1.05)}}</style>
<div class="topo"><img src="https://ubojbntfludtleoptmge.supabase.co/storage/v1/object/public/produtos/logo_1795499644481_IMG_4260.png" style="width:            
  width:55px;height:55px;animation:flutuar 2sease-in-out infinite;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:6px"><b></b><a href="admin.html">← Voltar</a></div>
<div class="caixa">
<h3>📦 Pedidos Recebidos - ADMIN</h3>
<p style="color:#666;font-size:13px;text-align:center">Aqui aparecem TODOS os pedidos. O código NUNCA some aqui. Os registos ficam para sempre.</p>
<div id="contadorNovos" style="background:#fef3c7;border:2px solid #f59e0b;border-radius:12px;padding:12px;text-align:center;font-weight:800;margin:10px 0;display:none">🆕 Pedidos Novos: <span id="numNovos">0</span></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
<button class="btn btn-verde" onclick="location.href='admin-vendas.html'">💰 Ver Vendas do Dia →</button>
<button class="btn btn-azul" onclick="atualizarAdmin()">🔄 Atualizar</button>
</div>
</div>
<div id="lista"><p style="text-align:center;color:#888">A carregar pedidos...</p></div>
<div id="modalCodigo" class="modal-fundo" onclick="if(event.target.id==='modalCodigo') fecharModalCodigo()"><div class="modal-box">
<div style="font-size:40px">🔖</div><h3>Finalizar Entrega com Código</h3>
<p style="color:#666;font-size:13px">Pedido: <b id="codigoPedidoModal">-</b></p>
<input id="inputCodigoConfirmar" placeholder="CN-XXXXXX"><p id="erroCodigo" style="color:#dc2626;font-size:13px;display:none"></p>
<button class="btn btn-verde" onclick="confirmarComCodigo()">✅ Confirmar Código - Entregar Automático</button>
<button class="btn btn-cinza" style="margin-top:8px" onclick="fecharModalCodigo()">Cancelar</button></div></div>
<div id="modalFatura" class="modal-fundo modal-fatura" onclick="if(event.target.id==='modalFatura') fecharFatura()"><div class="modal-box">
<div class="fatura-topo"><b>🧾 Fatura - Casa Nova</b><button onclick="fecharFatura()">❌</button></div>
<div class="fatura-conteudo"><div id="conteudoFatura"></div></div>
<div class="fatura-rodape"><button class="btn btn-azul" onclick="window.print()">🖨️ Imprimir</button><button class="btn btn-cinza" onclick="fecharFatura()">❌ Fechar</button></div>
</div></div>
<script>
localStorage.setItem('eu_sou_admin','1'); localStorage.setItem('admin_casa_nova','1');
let toastTimer; let pedidoParaFinalizar = null; let listaAtual = [];
function aviso(msg,tipo){let t=document.getElementById('toast');t.textContent=msg;t.className='mostrar '+(tipo||'sucesso');clearTimeout(toastTimer);toastTimer=setTimeout(()=>{t.className='';},3000);}
function badge(status){ let s=(status||'Novo').toLowerCase(); if(s.includes('entregue')) return '<span class="badge badge-entregue">✅ Entregue</span>'; if(s.includes('recebido')) return '<span class="badge badge-recebido">💙 Recebido - Pagamento Recebido</span>'; if(s.includes('aceite')||s.includes('prepar')) return '<span class="badge badge-aceite">🔥 '+status+'</span>'; if(s.includes('cancel')) return '<span class="badge badge-cancelado">❌ Cancelado</span>'; return '<span class="badge badge-novo">🆕 Novo</span>'; }
function atualizarContador(){ let novos = listaAtual.filter(p=> (p.status||p.estado||'Novo') === 'Novo').length; let c = document.getElementById('contadorNovos'); let n = document.getElementById('numNovos'); if(n) n.textContent = novos; if(c) c.style.display = novos > 0 ? 'block' : 'none'; }
async function atualizarAdmin(){ aviso('🔄 A atualizar...'); await carregar(); aviso('✅ Atualizado! Lista atualizada.'); }
async function carregar(){
  try{
    let r=await db.from('pedidos').select('*').order('created_at',{ascending:false});
    if(r.error){ document.getElementById('lista').innerHTML='<div class="caixa" style="text-align:center">Erro: '+r.error.message+'</div>'; return; }
    let lista=r.data||[];
    listaAtual = lista; atualizarContador();
    if(!lista.length){ document.getElementById('lista').innerHTML='<div class="caixa" style="text-align:center">Nenhum pedido ainda.</div>'; return; }
    document.getElementById('lista').innerHTML=lista.map(p=>{
      let nome=p.nome_cliente||p.cliente_nome||p.nome||'Cliente'; let tel=p.telefone||p.whatsapp||''; let morada=p.morada||p.endereco||p.localizacao||'';
      let total=Number(p.total||0); let pago=Number(p.valor_pago||p.pago||0); if(!pago){ pago = (p.tipo_entrega==='loja') ? total : Math.round(total/2); }
      let falta = total - pago; let pagouTudo = pago >= total; let status=p.status||p.estado||'Novo'; let codigo=p.codigo||'';
      let data=(p.created_at||'').slice(0,10).split('-').reverse().join('/')+' '+(p.created_at||'').slice(11,16);
      let itens=''; try{ let it=p.itens||p.produtos||p.items||p.detalhes; if(typeof it==='string') it=JSON.parse(it); if(Array.isArray(it)) itens=it.map(i=>`• ${i.nome||i.produto||'Produto'} x${i.qtd||i.quantidade||1}`).join('<br>'); }catch(e){}
      let isNovo = status === 'Novo'; let isRecebidoOuPrep = ['Recebido','Em Preparação','Aceite'].includes(status); let isEntregue = status === 'Entregue';
      let waMsg=encodeURIComponent('Olá '+nome+', recebemos o teu pedido na Casa Nova de '+total.toLocaleString()+' Kz. Obrigado!');
      let botoesAcao = '';
      if(isNovo){
        if(pagouTudo){ botoesAcao = `<button class="btn" style="background:#4338ca;color:#fff" onclick="marcarRecebido(${p.id})">💙 Recebido - Pagamento Recebido</button><p style="font-size:12px;color:#666;text-align:center">Pagou 100% (${total.toLocaleString()} Kz).</p>`; }
        else { botoesAcao = `<button class="btn btn-laranja" onclick="marcarPreparacao(${p.id})">🔥 Em Preparação / Aceite</button><p style="font-size:12px;color:#666;text-align:center">Pagou 50% (${pago.toLocaleString()} Kz). Falta: ${falta.toLocaleString()} Kz.</p>`; }
      } else if(isRecebidoOuPrep){
        botoesAcao = `<div style="background:#dcfce7;border:1px solid #16a34a;border-radius:8px;padding:10px;text-align:center;font-size:13px">✅ Status: <b>${status}</b><br>✉️ O cliente vai receber o envelope.</div>`;
        if(pagouTudo && status==='Em Preparação'){ botoesAcao += `<button class="btn" style="background:#fff7ed;color:#92400e;margin-top:8px;border:1px solid #f59e0b" onclick="marcarRecebido(${p.id})">🔄 Corrigir para Recebido (Pagou 100%)</button>`; }
        if(!pagouTudo && status==='Recebido'){ botoesAcao += `<button class="btn btn-laranja" style="margin-top:8px" onclick="marcarPreparacao(${p.id})">🔄 Corrigir para Em Preparação (Pagou 50%)</button>`; }
      }
      let botaoFinalizar = '';
      if(!isEntregue && (isRecebidoOuPrep || isNovo)){ botaoFinalizar = `<button class="btn btn-verde" style="margin-top:8px" onclick="abrirModalCodigo(${p.id},'${codigo}')">📦 Finalizar Entrega com Código</button>`; }
      if(isEntregue){ botaoFinalizar = `<div style="background:#dcfce7;border-radius:8px;padding:10px;text-align:center;font-weight:800;margin-top:8px">✅ Entregue - REGISTO GUARDADO</div>`; }
      return `<div class="card-pedido"><div style="display:flex;justify-content:space-between"><b>${nome}</b>${badge(status)}</div><div style="color:#666;font-size:13px;margin:4px 0">${data} • ${tel}<br>${morada}</div>${codigo ? `<div style="background:#fef3c7;border:1px dashed #f59e0b;border-radius:8px;padding:8px;text-align:center;margin:6px 0">🔖 <b>Código: ${codigo}</b><br><small style="color:#166534">No Admin o código NUNCA some</small></div>` : ''}<div style="font-size:14px;margin-top:6px">${itens}</div><div style="font-weight:800;color:#0b5ed7;margin:8px 0">Total: ${total.toLocaleString()} Kz<br><span style="color:#16a34a;font-size:13px">Pago: ${pago.toLocaleString()} Kz</span> <span style="color:#dc2626;font-size:13px">• Falta: ${falta.toLocaleString()} Kz</span><br><span style="font-size:12px;color:#666">${pagouTudo ? '💙 Pagou 100% - Levantamento na Loja' : '🚚 Pagou 50% - Entrega a Domicílio'}</span></div>${botoesAcao}${botaoFinalizar}<button class="btn" style="background:#e0e7ff;color:#3730a3;margin-top:8px" onclick="abrirFatura(${p.id})">🧾 Ver Fatura - Confirmar se está em Preparação ou Recebido</button><button class="btn btn-vermelho" style="margin-top:8px;background:#fee2e2;color:#991b1b" onclick="cancelarPedido(${p.id})">❌ Cancelar Pedido</button><button class="btn btn-verde" style="margin-top:8px" onclick="window.open('https://wa.me/${String(tel||'').replace(/[^0-9]/g,'')}?text=${waMsg}','_blank')">💬 Falar no WhatsApp</button></div>`;
    }).join('');
  }catch(e){ document.getElementById('lista').innerHTML='<div class="caixa" style="text-align:center">Erro ao carregar: '+e.message+'</div>'; }
}
function abrirFatura(id){ let p = listaAtual.find(x=>x.id==id); if(!p) return; let nome=p.nome_cliente||p.nome||'Cliente'; let tel=p.telefone||''; let morada=p.morada||''; let total=Number(p.total||0); let pago=Number(p.valor_pago||0); if(!pago) pago = (p.tipo_entrega==='loja') ? total : Math.round(total/2); let falta=total-pago; let pagouTudo=pago>=total; let status=p.status||'Novo'; let codigo=p.codigo||''; let data=(p.created_at||'').slice(0,10).split('-').reverse().join('/')+' '+(p.created_at||'').slice(11,16); let linhas=''; try{ let it=p.itens||p.produtos; if(typeof it==='string') it=JSON.parse(it); if(Array.isArray(it)) linhas=it.map(i=>`<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee"><span>${i.nome||'Produto'} x${i.qtd||1}</span><b>${Number(i.preco||0).toLocaleString()} Kz</b></div>`).join(''); }catch(e){} document.getElementById('conteudoFatura').innerHTML=`<div style="background:#111;color:#fff;padding:16px;text-align:center"><div style="font-size:28px;font-weight:900">CASA<span style="color:#f97316">NOVA</span></div></div><div style="padding:16px;font-size:14px;line-height:1.7"><div style="text-align:center;font-weight:900">Fatura Nº ${codigo}</div><div style="text-align:center;color:#666;font-size:12px">${data}</div><hr><b>Cliente:</b> ${nome}<br><b>Telefone:</b> ${tel}<br><b>Morada:</b> ${morada}<br><b>Status:</b> ${status}<hr>${linhas}<div style="border:1px solid #0b5ed7;border-radius:10px;padding:12px;margin-top:10px"><div style="display:flex;justify-content:space-between"><span>Total:</span><b>${total.toLocaleString()} Kz</b></div><div style="display:flex;justify-content:space-between"><span>Pago:</span><b style="color:#16a34a">${pago.toLocaleString()} Kz</b></div><div style="display:flex;justify-content:space-between"><span>Falta:</span><b style="color:#dc2626">${falta.toLocaleString()} Kz</b></div></div><div style="text-align:center;margin-top:10px;font-weight:800">${pagouTudo ? '✅ PAGO TOTAL' : '💰 PAGO 50% - FALTA '+falta.toLocaleString()+' Kz'}</div></div>`; document.getElementById('modalFatura').classList.add('aberto'); }
function fecharFatura(){ document.getElementById('modalFatura').classList.remove('aberto'); }
async function marcarRecebido(id){ let r = await db.from('pedidos').update({status:'Recebido'}).eq('id', id); if(r.error){ let r2 = await db.from('pedidos').update({estado:'Recebido'}).eq('id', id); if(r2.error){ aviso('❌ '+r2.error.message,'erro'); return; } } aviso('💙 Recebido! Cliente vai receber o envelope ✉️'); carregar(); }
async function marcarPreparacao(id){ let r = await db.from('pedidos').update({status:'Em Preparação'}).eq('id', id); if(r.error){ let r2 = await db.from('pedidos').update({estado:'Em Preparação'}).eq('id', id); if(r2.error){ aviso('❌ '+r2.error.message,'erro'); return; } } aviso('🔥 Em Preparação! Cliente vai receber o envelope ✉️'); carregar(); }
async function cancelarPedido(id){ if(!confirm('Cancelar este pedido?')) return; let r = await db.from('pedidos').update({status:'Cancelado'}).eq('id', id); if(r.error){ let r2 = await db.from('pedidos').update({estado:'Cancelado'}).eq('id', id); if(r2.error){ aviso('❌ '+r2.error.message,'erro'); return; } } aviso('❌ Pedido cancelado'); carregar(); }
function abrirModalCodigo(id, codigo){ pedidoParaFinalizar = {id: id, codigo: codigo}; document.getElementById('codigoPedidoModal').textContent = codigo || ''; document.getElementById('inputCodigoConfirmar').value = ''; document.getElementById('erroCodigo').style.display = 'none'; document.getElementById('modalCodigo').classList.add('aberto'); }
function fecharModalCodigo(){ document.getElementById('modalCodigo').classList.remove('aberto'); pedidoParaFinalizar = null; }
async function confirmarComCodigo(){ if(!pedidoParaFinalizar) return; let digitado = document.getElementById('inputCodigoConfirmar').value.trim().toUpperCase(); let certo = (pedidoParaFinalizar.codigo||'').toUpperCase(); if(digitado !== certo){ document.getElementById('erroCodigo').textContent = '❌ Código errado!'; document.getElementById('erroCodigo').style.display='block'; return; } let r = await db.from('pedidos').update({status:'Entregue'}).eq('id', pedidoParaFinalizar.id); if(r.error){ let r2 = await db.from('pedidos').update({estado:'Entregue'}).eq('id', pedidoParaFinalizar.id); if(r2.error){ aviso('❌ '+r2.error.message,'erro'); return; } } fecharModalCodigo(); aviso('✅ Entregue!'); carregar(); }
carregar();
</script></body></html>
