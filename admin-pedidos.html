<!DOCTYPE html>
<html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meus Pedidos - Casa Nova</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabase.js"></script>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f1f3f6;padding:12px;padding-bottom:100px}
.topo{background:#0b5ed7;color:#fff;padding:12px;border-radius:10px;display:flex;justify-content:space-between;align-items:center}
.topo a{color:#fff;text-decoration:none;font-weight:700}
.caixa{background:#fff;padding:14px;border-radius:12px;margin-top:12px}
.card-pedido{background:#fff;padding:14px;border-radius:12px;margin-top:10px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700}
.badge-novo{background:#dbeafe;color:#1e40af}.badge-prep{background:#fef3c7;color:#92400e}.badge-rec{background:#e0e7ff;color:#3730a3}.badge-ent{background:#dcfce7;color:#166534}.badge-canc{background:#fee2e2;color:#991b1b}
#btnEnvelope{position:fixed;left:14px;bottom:20px;z-index:9999;width:66px;height:66px;border-radius:50%;background:#0b5ed7;color:#fff;border:3px solid #fff;box-shadow:0 4px 16px rgba(0,0,0,.4);font-size:30px;cursor:pointer;display:none;align-items:center;justify-content:center;animation:flutuarEnv 2s ease-in-out infinite}
@keyframes flutuarEnv{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
#badgeEnvelope{position:absolute;top:-4px;right:-4px;background:#dc2626;color:#fff;min-width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;border:2px solid #fff}
#modalEnvelope{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:10000;display:none;align-items:center;justify-content:center;padding:20px}
#modalEnvelope.aberto{display:flex}
.modal-env{background:#fff;width:100%;max-width:380px;border-radius:20px;overflow:hidden;max-height:90vh;overflow-y:auto}
.env-topo{background:#0b5ed7;color:#fff;padding:16px;text-align:center}
.env-msg{padding:14px;border-bottom:1px solid #eee}
</style></head>
<body>
<div class="topo"><b>🏠 Casa Nova</b><a href="index.html">← Voltar à Loja</a></div>
<div class="caixa"><h3 style="text-align:center;margin:0">🔖 Meus Códigos / Pedidos</h3><p style="text-align:center;color:#666;font-size:13px">O teu código fica visível só 5 minutos. Aponta num caderno!</p></div>
<div id="lista"><p style="text-align:center;color:#888">A carregar...</p></div>
<button id="btnEnvelope" onclick="abrirEnvelope()">✉️<span id="badgeEnvelope">0</span></button>
<div id="modalEnvelope" onclick="if(event.target.id==='modalEnvelope') fecharEnvelope()"><div class="modal-env">
<div class="env-topo"><div style="font-size:36px">✉️</div><h3 style="margin:4px 0">Mensagens da Loja</h3></div>
<div id="listaMensagens"></div>
<div style="padding:14px"><button onclick="fecharEnvelope()" style="background:#dc2626;color:#fff;border:0;padding:14px;border-radius:12px;width:100%;font-weight:800">❌ Fechar (X)</button><p style="font-size:12px;color:#666;text-align:center">Se fechares, o envelope volta em 2 minutos para te lembrar.</p></div>
</div></div>
<script>
let meusPedidos = [];
let notificacoes = [];
try{ notificacoes = JSON.parse(localStorage.getItem('notificacoes_casa_nova')||'[]'); }catch(e){ notificacoes=[]; }
let ultimoStatus = {};
try{ ultimoStatus = JSON.parse(localStorage.getItem('casanova_status_pedidos')||'{}'); }catch(e){ ultimoStatus={}; }
let primeiraVez = false;
try{ primeiraVez = !localStorage.getItem('casanova_status_pedidos'); }catch(e){ primeiraVez=true; }
let timerReaparecer = null;
function salvarNotif(){ localStorage.setItem('notificacoes_casa_nova', JSON.stringify(notificacoes)); }
function getMeusCodigos(){
  let arr = [];
  try{ arr = JSON.parse(localStorage.getItem('meus_codigos')||'[]'); }catch(e){}
  try{ let v = JSON.parse(localStorage.getItem('meus_pedidos')||'[]'); arr = [...arr, ...v]; }catch(e){}
  let ult = localStorage.getItem('ultimo_pedido_codigo'); if(ult) arr.push({codigo:ult});
  return arr;
}
function textoMensagem(p){
  let nome = p.nome_cliente||p.nome||'Cliente';
  let tipo = (p.tipo_entrega||'').toLowerCase();
  let status = (p.status||'').toLowerCase();
  if(status.includes('recebido')) return `Olá ${nome}, nós recebemos o teu pagamento e agradecemos por você na nossa loja. Obrigado! ❤️`;
  if(status.includes('prepar') || status.includes('aceite')){
    if(tipo==='loja') return `Olá ${nome}, nós recebemos o teu pagamento e agradecemos por você na nossa loja. O teu pedido está a ser preparado para levantamento.`;
    return `Olá ${nome}, o teu pedido foi recebido e está a ser preparado. Vamos avisar quando sair para entrega. 🛵`;
  }
  if(status.includes('entregue')) return `Olá ${nome}, o teu pedido foi entregue. Obrigado por comprar na Casa Nova! Já pagaste 100%. 🎉`;
  if(status.includes('cancel')) return `Olá ${nome}, o teu pedido foi cancelado. Fala connosco no WhatsApp.`;
  return `Olá ${nome}, recebemos o teu pedido ${p.codigo||''}. Estamos a verificar.`;
}
function atualizarEnvelope(){
  let naoLidas = notificacoes.filter(n=>!n.lida);
  let btn = document.getElementById('btnEnvelope');
  let badge = document.getElementById('badgeEnvelope');
  if(!naoLidas.length){ btn.style.display='none'; return; }
  btn.style.display='flex';
  badge.textContent = naoLidas.length;
}
function abrirEnvelope(){
  let box = document.getElementById('listaMensagens');
  if(!notificacoes.length) box.innerHTML = '<p style="text-align:center;color:#666;padding:20px">Sem mensagens.</p>';
  else box.innerHTML = notificacoes.slice().reverse().map(n=>`<div class="env-msg"><b>📦 Pedido ${n.codigo} - ${n.status}</b><br><span style="font-size:14px">${n.mensagem}</span><br><small style="color:#888">${new Date(n.quando).toLocaleString('pt-PT')}</small></div>`).join('');
  document.getElementById('modalEnvelope').classList.add('aberto');
}
function fecharEnvelope(){
  document.getElementById('modalEnvelope').classList.remove('aberto');
  // Marca como lida quando abre e fecha com X
  notificacoes = notificacoes.map(n=>({...n, lida:true}));
  salvarNotif();
  atualizarEnvelope();
  // Volta em 2 minutos mesmo que tenha fechado
  clearTimeout(timerReaparecer);
  timerReaparecer = setTimeout(()=>{
    // Reaparece só se ainda houver notificações (para lembrar)
    if(notificacoes.length){
      notificacoes = notificacoes.map(n=>({...n, lida:false}));
      salvarNotif(); atualizarEnvelope();
    }
  }, 120000); // 2 minutos = 120000ms
}
async function carregar(){
  let codigos = getMeusCodigos().map(c=>c.codigo||c);
  let cliente = null; try{ cliente = JSON.parse(localStorage.getItem('cliente_casa_nova')||'null'); }catch(e){}
  let meuTel = cliente ? String(cliente.telefone||'').replace(/\D/g,'').slice(-9) : '';
  let r = await db.from('pedidos').select('*').order('created_at',{ascending:false}).limit(20);
  let lista = r.data||[];
  let meus = lista.filter(p=>{
    if(codigos.includes(p.codigo)) return true;
    if(meuTel){
      let tp = String(p.telefone||'').replace(/\D/g,'').slice(-9);
      if(tp && tp===meuTel) return true;
    }
    return false;
  });
  meusPedidos = meus;
  // Detecta mudança de status e cria notificação
  if(!primeiraVez){
    meus.forEach(p=>{
      let antigo = ultimoStatus[p.codigo];
      if(antigo && antigo !== p.status){
        // Só cria se for Recebido / Preparação / Entregue
        let s = (p.status||'').toLowerCase();
        if(s.includes('recebido') || s.includes('prepar') || s.includes('aceite') || s.includes('entregue')){
          let ja = notificacoes.find(n=>n.codigo===p.codigo && n.status===p.status);
          if(!ja){
            notificacoes.push({codigo:p.codigo, status:p.status, mensagem:textoMensagem(p), quando:new Date().toISOString(), lida:false});
            salvarNotif();
          }
        }
      }
      ultimoStatus[p.codigo]=p.status;
    });
    localStorage.setItem('casanova_status_pedidos', JSON.stringify(ultimoStatus));
  } else {
    // Primeira vez: guarda sem avisar, para não avisar de pedidos antigos
    meus.forEach(p=>{ ultimoStatus[p.codigo]=p.status; });
    localStorage.setItem('casanova_status_pedidos', JSON.stringify(ultimoStatus));
    primeiraVez=false;
  }
  atualizarEnvelope();
  if(!meus.length){ document.getElementById('lista').innerHTML='<div class="caixa" style="text-align:center">Ainda não tens pedidos.<br><a href="index.html" style="color:#0b5ed7;font-weight:800">Voltar à Loja</a></div>'; return; }
  document.getElementById('lista').innerHTML = meus.map(p=>{
    let total=Number(p.total||0); let pago=Number(p.valor_pago||0);
    if(!pago) pago = (p.tipo_entrega==='loja') ? total : Math.round(total/2);
    let falta = total-pago; let pagouTudo = pago>=total;
    let s=(p.status||'Novo').toLowerCase();
    let badgeCls = s.includes('entregue')?'badge-ent':s.includes('recebido')?'badge-rec':s.includes('prepar')||s.includes('aceite')?'badge-prep':s.includes('cancel')?'badge-canc':'badge-novo';
    let agora = Date.now();
    let criado = new Date(p.created_at||Date.now()).getTime();
    let mostraCodigo = (agora-criado) < 5*60*1000;
    return `<div class="card-pedido">
      <div style="display:flex;justify-content:space-between"><b>${p.nome_cliente||'Cliente'}</b><span class="badge ${badgeCls}">${p.status}</span></div>
      ${mostraCodigo ? `<div style="background:#fef3c7;border:1px dashed #f59e0b;border-radius:8px;padding:10px;text-align:center;margin:8px 0">🔖 <b>Código: ${p.codigo}</b><br><small>Aponta! Some em 5 minutos</small></div>` : `<div style="background:#eee;border-radius:8px;padding:8px;text-align:center;font-size:13px;color:#666">🔖 Código escondido após 5 min - Já apontaste?</div>`}
      <div style="font-size:14px">Total: <b>${total.toLocaleString()} Kz</b><br>Pago: <b style="color:#16a34a">${pago.toLocaleString()} Kz</b> • Falta: <b style="color:#dc2626">${falta.toLocaleString()} Kz</b><br>${pagouTudo ? '✅ <b>PAGO 100% - PAGO POR COMPLETO</b>' : '💰 Pagou 50% - Falta pagar na entrega'}</div>
      <div style="font-size:13px;color:#666;margin-top:6px">${p.morada||''}</div>
    </div>`;
  }).join('');
}
carregar();
setInterval(carregar, 10000);
atualizarEnvelope();
</script></body></html>
