<!DOCTYPE html>
<html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Produtos - Casa Nova</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabase.js"></script>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f1f3f6;padding:12px}
.topo{background:#0b5ed7;color:#fff;padding:8px 12px;border-radius:10px;display:flex;justify-content:space-between;align-items:center;height:72px}
.topo .logo{display:flex;align-items:center;gap:8px}
.topo .logo-img{height:56px;width:auto;max-width:200px;object-fit:contain;background:transparent;border-radius:0;padding:0;display:none;transform-origin:center;animation:logoZoom 4s ease-in-out infinite}
.topo.tem-logo .logo-text{display:none}
.topo a{color:#fff;text-decoration:none;font-weight:700}
@keyframes logoZoom{
  0%{transform:scale(0.7) translateY(0) rotate(0deg)}
  25%{transform:scale(1.15) translateY(-3px) rotate(0deg)}
  40%{transform:scale(1.45) translateY(0) rotate(0deg)}
  48%{transform:scale(1.45) translateY(0) rotate(-6deg)}
  56%{transform:scale(1.45) translateY(0) rotate(6deg)}
  64%{transform:scale(1.45) translateY(0) rotate(-5deg)}
  72%{transform:scale(1.45) translateY(0) rotate(4deg)}
  80%{transform:scale(1.25) translateY(4px) rotate(0deg)}
  88%{transform:scale(1.08) translateY(-3px) rotate(0deg)}
  94%{transform:scale(0.96) translateY(2px) rotate(0deg)}
  100%{transform:scale(1) translateY(0) rotate(0deg)}
}
.caixa{background:#fff;padding:14px;border-radius:12px;margin-top:12px}
.caixa h3{background:#eff6ff;border:2px solid #0b5ed7;border-radius:999px;padding:10px 14px;text-align:center;margin:0 0 12px}
input{width:100%;padding:11px;margin-bottom:8px;border:1px solid #cfd5df;border-radius:8px;font-size:15px}
.chip{border:1px solid #cfd5df;background:#fff;padding:8px 14px;border-radius:20px;font-size:14px;white-space:nowrap;cursor:pointer}
.chip.ativo{background:#0b5ed7;color:#fff;border-color:#0b5ed7}
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:#fff;border-radius:14px;padding:10px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.card.promo{border:2px solid #dc2626}
.card img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:#eef0f4}
.card h3{font-size:14px;margin:8px 0 4px;background:none;border:none;padding:0;text-align:left;border-radius:0}
.preco{font-weight:800;color:#0b5ed7}
.preco-antigo{color:#999;text-decoration:line-through;font-size:12px;font-weight:400;margin-right:6px}
.desconto{color:#dc2626;font-size:11px;font-weight:800}
.selo-promo{background:#dc2626;color:#fff;font-size:11px;font-weight:900;padding:3px 8px;border-radius:20px;display:inline-block}
.btn{border:0;padding:10px;border-radius:8px;font-weight:700;cursor:pointer;width:100%}
.btn-azul{background:#0b5ed7;color:#fff}
.btn-vermelho{background:#dc2626;color:#fff}
.btn-verde{background:#16a34a;color:#fff}
.btn-cinza{background:#e5e7eb;color:#111}
#toast{position:fixed;top:12px;left:50%;transform:translateX(-50%) translateY(-80px);background:#111827;color:#fff;padding:14px 18px;border-radius:14px;z-index:9999;font-weight:700;max-width:92%;text-align:center;transition:.35s;opacity:0;pointer-events:none}
#toast.mostrar{transform:translateX(-50%) translateY(0);opacity:1}
#toast.sucesso{background:#16a34a}
#toast.erro{background:#dc2626}
#toast.aviso{background:#f59e0b;color:#111}
#modalFundo{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:9998;padding:16px}
#modalFundo.mostrar{display:flex}
#modalCaixa{background:#fff;width:100%;max-width:360px;border-radius:18px;padding:20px;text-align:center}
</style></head>
<body>
<div id="toast"></div>
<div id="modalFundo"><div id="modalCaixa"><h3>Confirmar?</h3><p id="modalTexto"></p><button class="btn btn-verde" id="modalSim" style="margin-top:10px">✅ Sim, continuar</button><button class="btn" onclick="fecharModal(false)" style="margin-top:8px;background:#e5e7eb;color:#111">Cancelar</button></div></div>

<div class="topo" id="topoSite"><div class="logo"><img id="logoTopo" class="logo-img" src=""><span class="logo-text"><b>Casa Nova</b></span></div><a href="admin.html">← Voltar</a></div>

<div class="caixa">
<h3>🛍️ Produtos na Loja <span id="total" style="font-size:14px;color:#666"></span></h3>
<input id="busca" placeholder="🔍 Pesquisar produto..." oninput="filtrar()">
<div class="cats" id="cats"></div>
<div class="grid" id="grade"><p>A carregar...</p></div>
</div>

<script>
let toastTimer;
function aviso(msg,tipo){let t=document.getElementById('toast');t.textContent=msg;t.className='mostrar '+(tipo||'sucesso');clearTimeout(toastTimer);toastTimer=setTimeout(()=>{t.className='';},3000);}
let resolverModal=null;
function perguntar(texto){return new Promise(res=>{resolverModal=res;document.getElementById('modalTexto').textContent=texto;document.getElementById('modalFundo').classList.add('mostrar');});}
function fecharModal(v){document.getElementById('modalFundo').classList.remove('mostrar');if(resolverModal){resolverModal(v);resolverModal=null;}}
document.getElementById('modalSim').onclick=()=>fecharModal(true);
async function carregarLogoTopo(){
  try{let r=await db.from('loja_config').select('logo_url').eq('id',1).maybeSingle();let logo=r.data?.logo_url;if(logo){let img=document.getElementById('logoTopo');img.src=logo;img.style.display='block';document.getElementById('topoSite').classList.add('tem-logo');}}catch(e){}
}
let todos=[]; let catAtual='Todas';
async function carregar(){
  let r=await db.from('produtos').select('*').order('id',{ascending:false});
  todos=r.data||[];
  document.getElementById('total').textContent='('+todos.length+')';
  let cats=['Todas',...new Set(todos.map(p=>p.categoria).filter(Boolean))];
  document.getElementById('cats').innerHTML=cats.map(c=>`<button class="chip ${c===catAtual?'ativo':''}" onclick="mudarCat('${c}',this)">${c}</button>`).join('');
  filtrar();
}
function mudarCat(c,btn){catAtual=c;document.querySelectorAll('.chip').forEach(x=>x.classList.remove('ativo'));if(btn)btn.classList.add('ativo');filtrar();}
function filtrar(){
  let termo=document.getElementById('busca').value.toLowerCase();
  let lista=todos.filter(p=>{
    let okCat=catAtual==='Todas'||p.categoria===catAtual;
    let okBusca=!termo||(p.nome||'').toLowerCase().includes(termo);
    return okCat&&okBusca;
  });
  let g=document.getElementById('grade');
  if(!lista.length){g.innerHTML='<p>Nenhum produto encontrado.</p>';return;}
  g.innerHTML=lista.map(p=>{
    let antigo=Number(p.preco_antigo||0), novo=Number(p.preco||0);
    let perc=(antigo>novo&&antigo>0)?Math.round((1-novo/antigo)*100):0;
    return `
    <div class="card ${perc?'promo':''}">
      <img src="${p.imagem||p.imagem_url||'https://via.placeholder.com/300'}" onerror="this.src='https://via.placeholder.com/300'">
      ${perc?`<div style="margin-top:6px"><span class="selo-promo">🔥 PROMOÇÃO -${perc}%</span></div>`:''}
      <h3>${p.nome}</h3>
      <div style="color:#666;font-size:12px">${p.categoria||''}</div>
      ${perc?`<div><span class="preco-antigo">${antigo.toLocaleString()} Kz</span> <span class="desconto">-${perc}%</span></div>`:''}
      <div class="preco">${novo.toLocaleString()} Kz</div>
      <div style="background:#fef2f2;border:1px dashed #dc2626;border-radius:10px;padding:8px;margin-top:8px">
        <label style="font-size:12px;font-weight:800;color:#dc2626">🔥 Preço da promoção (novo preço mais baixo):</label>
        <div style="font-size:12px;color:#666;margin:2px 0">Preço atual: <b>${novo.toLocaleString()} Kz</b> - vai ficar riscado</div>
        <input id="promo-${p.id}" type="number" placeholder="Ex: 114000" value="${perc?novo:''}" style="margin:6px 0">
        <button class="btn btn-vermelho" onclick="salvarPromo(${p.id})">💾 Guardar Promoção</button>
        ${perc?`<button class="btn btn-cinza" onclick="tirarPromo(${p.id})" style="margin-top:6px">❌ Tirar Promoção (volta a ${antigo.toLocaleString()} Kz)</button>`:''}
      </div>
      <button class="btn btn-azul" onclick="location.href='admin-categorias.html'" style="margin-top:8px">✏️ Editar</button>
      <button class="btn btn-vermelho" onclick="apagar(${p.id},'${(p.nome||'').replace(/'/g,'')}')" style="margin-top:6px">🗑️ Apagar</button>
    </div>
  `}).join('');
}
// 🔥 CORRIGIDO: TU METES O PREÇO NOVO MAIS BAIXO, ELE GUARDA O ATUAL COMO ANTIGO
async function salvarPromo(id){
  let novoPreco=Number(document.getElementById('promo-'+id).value||0);
  if(!novoPreco){ aviso('⚠️ Escreve o preço novo da promoção! Ex: 114000','aviso'); return; }
  let p=todos.find(x=>x.id==id);
  let precoAtual=Number(p.preco);
  if(novoPreco >= precoAtual){ aviso('⚠️ O preço da promoção tem que ser MENOR que '+precoAtual.toLocaleString()+' Kz','aviso'); return; }
  let perc=Math.round((1-novoPreco/precoAtual)*100);
  let ok=await perguntar('Confirmar promoção?\nPreço atual '+precoAtual.toLocaleString()+' Kz vai ficar riscado.\nNovo preço: '+novoPreco.toLocaleString()+' Kz (-'+perc+'%)');
  if(!ok) return;
  let r=await db.from('produtos').update({preco:novoPreco, preco_antigo:precoAtual}).eq('id',id);
  if(r.error) return aviso('❌ '+r.error.message,'erro');
  aviso('✅ Promoção guardada! -'+perc+'% na loja');
  carregar();
}
async function tirarPromo(id){
  let p=todos.find(x=>x.id==id);
  let ok=await perguntar('Tirar promoção? O preço volta a '+Number(p.preco_antigo).toLocaleString()+' Kz');
  if(!ok) return;
  let r=await db.from('produtos').update({preco:Number(p.preco_antigo), preco_antigo:null}).eq('id',id);
  if(r.error) return aviso('❌ '+r.error.message,'erro');
  aviso('✅ Promoção tirada, preço voltou ao normal');
  carregar();
}
async function apagar(id,nome){
  let ok=await perguntar('Apagar '+nome+' da loja?');
  if(!ok) return;
  let r=await db.from('produtos').delete().eq('id',id);
  if(r.error) return aviso('❌ '+r.error.message,'erro');
  aviso('✅ Produto apagado'); carregar();
}
carregarLogoTopo(); carregar();
</script></body></html>
