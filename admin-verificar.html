<!DOCTYPE html>
<html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verificar Pedido - Casa Nova</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabase.js"></script>
<style>body{margin:0;font-family:Arial;background:#f1f3f6;padding:12px}.topo{background:#0b5ed7;color:#fff;padding:14px;border-radius:10px;display:flex;justify-content:space-between;align-items:center}.topo a{color:#fff;text-decoration:none;font-weight:700}.caixa{background:#fff;padding:16px;border-radius:12px;margin-top:12px}input{width:100%;padding:14px;border:1px solid #cfd5df;border-radius:10px;font-size:18px;text-align:center;letter-spacing:2px;text-transform:uppercase;box-sizing:border-box}.btn{border:0;padding:14px;border-radius:10px;width:100%;font-weight:700;cursor:pointer;margin-top:10px}.btn-azul{background:#0b5ed7;color:#fff}.linha{padding:10px 0;border-bottom:1px solid #eee;font-size:15px}img.comp{width:100%;border-radius:12px;margin-top:10px;cursor:pointer;max-height:220px;object-fit:contain;background:#f8fafc}
#visorComp{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:9999;display:none;align-items:center;justify-content:center;padding:10px}
#visorComp.aberto{display:flex}
#visorComp img{max-width:100%;max-height:92vh;border-radius:10px;object-fit:contain}
#visorComp span{position:absolute;top:12px;right:16px;color:#fff;font-size:20px;font-weight:800;cursor:pointer;background:#dc2626;padding:8px 14px;border-radius:20px}
</style></head>
<body>
<div class="topo"><b>🔍 Verificar Pedido</b><a href="admin.html">← Voltar</a></div>
<div class="caixa">
  <h3 style="margin:0">🔖 Verificação de Comprovativo e Código</h3>
  <p style="color:#666;font-size:13px">Escreve o código que o cliente te deu (ex: CN-123456)</p>
  <input id="codigoInput" placeholder="CN-123456">
  <button class="btn btn-azul" onclick="verificar()">🔍 VERIFICAR PEDIDO</button>
</div>
<div id="resultado"></div>
<div id="visorComp" onclick="fecharComp()"><span>✕ Fechar</span><img id="imgGrande" src=""></div>
<script>
function abrirComp(url){ document.getElementById('imgGrande').src=url; document.getElementById('visorComp').classList.add('aberto'); }
function fecharComp(){ document.getElementById('visorComp').classList.remove('aberto'); }

function getUrlComprovativo(valor){
  if(!valor) return null;
  valor = String(valor).trim();
  if(valor.startsWith('http')) return valor;
  let nome = valor.split('/').pop();
  try{
    let r = db.storage.from('comprovativos').getPublicUrl(nome);
    if(r && r.data && r.data.publicUrl) return r.data.publicUrl;
  }catch(e){}
  try{
    let r2 = db.storage.from('comprovativos').getPublicUrl(valor);
    if(r2 && r2.data && r2.data.publicUrl) return r2.data.publicUrl;
  }catch(e){}
  return null;
}

async function verificar(){
  let cod = document.getElementById('codigoInput').value.trim().toUpperCase();
  if(!cod){ alert('Escreve o código!'); return; }
  document.getElementById('resultado').innerHTML = '<p style="text-align:center">A procurar...</p>';
  let r = await db.from('pedidos').select('*').eq('codigo', cod).maybeSingle();
  if(r.error || !r.data){
    document.getElementById('resultado').innerHTML = `<div class="caixa" style="text-align:center;color:#dc2626"><h3>❌ Código não encontrado</h3><p>Verifica se o cliente escreveu bem o código.</p></div>`;
    return;
  }
  let p = r.data;
  let st = String(p.status || p.estado || '').toLowerCase();
  if(st === 'entregue'){
    document.getElementById('resultado').innerHTML = `<div class="caixa" style="text-align:center;border:2px solid #dc2626"><h3 style="color:#dc2626">🚫 CÓDIGO JÁ USADO - JÁ FOI ENTREGUE</h3><p>Código: <b>${p.codigo}</b></p><p>Cliente: <b>${p.nome_cliente || p.nome || '-'}</b></p><p style="color:#dc2626;font-weight:700">Não entregues de novo!</p></div>`;
    return;
  }
  let nome = p.nome_cliente || p.nome || '-';
  let email = p.email || '-';
  let telefone = p.telefone || '-';
  let total = Number(p.total || p.valor_total || 0);
  let pago = Number(p.valor_pago || 0);
  let falta = Number(p.falta_pagar || (total - pago));
  let itens = '';
  try{
    let it = p.itens || p.produtos || p.items;
    if(typeof it === 'string') it = JSON.parse(it);
    if(Array.isArray(it)) itens = it.map(i=>`• ${i.nome||i.produto} x${i.qtd||i.quantidade||1} - ${Number(i.preco||0).toLocaleString()} Kz`).join('<br>');
    else itens = it || '-';
  }catch(e){ itens = p.itens || '-'; }

  // RETIFICADO: ABRE PDF, PNG E FOTO - O TEU FICHEIRO ANTIGO NÃO TINHA ISTO
  let comp = '';
  let urlComp = getUrlComprovativo(p.comprovativo_url);
  if(urlComp){
    let ePdf = urlComp.toLowerCase().includes('.pdf');
    if(ePdf){
      comp = `<h3>🧾 Comprovativo (PDF)</h3>
      <div style="text-align:center;background:#f8fafc;border:1px solid #e5e7eb;border-radius:12px;padding:20px">
        <div style="font-size:50px">📄</div><b>Comprovativo em PDF</b><br>
        <a href="${urlComp}" target="_blank" style="display:block;background:#dc2626;color:#fff;padding:14px;border-radius:12px;text-decoration:none;font-weight:800;margin-top:12px">📄 ABRIR PDF</a>
        <a href="${urlComp}" download style="display:block;background:#111;color:#fff;padding:12px;border-radius:12px;text-decoration:none;font-weight:700;margin-top:8px">⬇️ Baixar PDF</a>
      </div>
      <iframe src="${urlComp}" style="width:100%;height:300px;border:1px solid #eee;border-radius:12px;margin-top:10px"></iframe>`;
    } else {
      comp = `<h3>🧾 Comprovativo (Foto / PNG)</h3>
      <img class="comp" src="${urlComp}" onclick="abrirComp('${urlComp}')" onerror="this.style.display='none';document.getElementById('erroComp').style.display='block'">
      <p style="color:#0b5ed7;font-size:13px;font-weight:700;text-align:center">👆 Clica na foto para ampliar</p>
      <a href="${urlComp}" target="_blank" style="display:block;text-align:center;background:#111;color:#fff;padding:12px;border-radius:10px;text-decoration:none;font-weight:700;margin-top:8px">🔍 Abrir foto em tamanho grande</a>
      <div id="erroComp" style="display:none;color:#dc2626;font-size:13px">⚠️ A foto não foi encontrada no Storage. Este pedido é antigo. Pede ao cliente para enviar o comprovativo no WhatsApp: <a href="https://wa.me/244${String(telefone).replace(/\D/g,'').slice(-9)}" style="color:#16a34a;font-weight:800">Abrir WhatsApp →</a></div>`;
    }
  } else if(p.comprovativo_url){
    comp = `<h3>🧾 Comprovativo</h3><p>📎 Ficheiro: ${p.comprovativo_url}<br><small style="color:#999">Este pedido foi feito antes da correção do Storage, por isso a foto não ficou guardada. Pede ao cliente para mostrar o comprovativo no WhatsApp.</small></p>`;
  } else {
    comp = `<p style="color:#999">Sem comprovativo enviado</p>`;
  }

  document.getElementById('resultado').innerHTML = `<div class="caixa">
    <div style="text-align:center"><span style="background:#dcfce7;color:#166534;padding:6px 14px;border-radius:20px;font-weight:700">✅ PEDIDO ENCONTRADO - ${p.codigo}</span></div>
    <div class="linha">👤 <b>Nome:</b> ${nome}</div>
    <div class="linha">📧 <b>E-mail:</b> ${email}</div>
    <div class="linha">📞 <b>Telefone:</b> ${telefone}</div>
    <div class="linha">📍 <b>Morada:</b> ${p.morada || '-'}</div>
    <div class="linha">🚚 <b>Tipo:</b> ${p.tipo_entrega || '-'}</div>
    <div class="linha">💳 <b>Pagamento:</b> ${p.pagamento || '-'}</div>
    <div class="linha">🛒 <b>O que comprou:</b><br>${itens}</div>
    <div class="linha">💰 <b>Total:</b> ${total.toLocaleString()} Kz</div>
    <div class="linha">✅ <b>O que pagou:</b> <span style="color:#16a34a;font-weight:700">${pago.toLocaleString()} Kz</span></div>
    <div class="linha">❗ <b>O que falta pagar:</b> <span style="color:#dc2626;font-weight:700">${falta.toLocaleString()} Kz</span></div>
    <div class="linha">📊 <b>Estado:</b> ${p.status || p.estado || 'Novo'}</div>
    ${comp}
    <button onclick="marcarEntregue('${p.codigo}')" style="background:#16a34a;color:#fff;border:0;padding:14px;border-radius:12px;width:100%;font-weight:800;font-size:16px;margin-top:14px;cursor:pointer">✅ MARCAR COMO ENTREGUE - Invalidar Código</button>
    <p style="text-align:center;color:#dc2626;font-size:12px;margin-top:8px">⚠️ Depois de clicares, este código nunca mais vai funcionar.</p>
  </div>`;
}
async function marcarEntregue(cod){
  if(!confirm('Tens a certeza que já entregaste este pedido?\n\nDepois disso o código ' + cod + ' NUNCA mais vai funcionar.')) return;
  let r1 = await db.from('pedidos').update({status:'Entregue', estado:'Entregue'}).eq('codigo', cod);
  if(r1.error){ alert('Erro: ' + r1.error.message); return; }
  alert('✅ Pedido marcado como ENTREGUE!');
  verificar();
}
</script></body></html>
