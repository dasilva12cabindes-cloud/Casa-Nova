<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin - Casa Nova</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .caixa { background: #fff; padding: 16px; border-radius: 12px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .caixa h2 { font-size: 1.1rem; margin-bottom: 10px; }
    .caixa input, .caixa select, .caixa textarea { width: 100%; padding: 11px; margin-bottom: 8px; border: 1px solid #cfd5df; border-radius: 8px; font-size: 1rem; font-family: inherit; }
    .linha { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 0; border-top: 1px solid #eef0f4; font-size: .95rem; }
    .linha img { width: 44px; height: 44px; object-fit: cover; border-radius: 6px; }
    .linha .info { flex: 1; }
    .mini { border: 0; padding: 8px 10px; border-radius: 6px; font-size: .85rem; cursor: pointer; background: #eef0f4; }
    .mini.vermelho { background: #fde2e0; color: #c0392b; }
    #msg { margin: 8px 0; font-weight: 600; }
    .links { display: flex; gap: 12px; margin-bottom: 14px; }
    .links a { color: #0b5ed7; font-weight: 600; }
  </style>
</head>
<body>
  <header class="topo">
    <a href="index.html" class="logo">Casa Nova</a>
    <nav><a href="index.html">Loja</a></nav>
  </header>

  <main class="container">
    <div class="links"><a href="admin-pedidos.html">Ver pedidos</a></div>
    <p id="msg"></p>

    <div class="caixa">
      <h2>Categorias</h2>
      <input type="text" id="cat-nome" placeholder="Nome da categoria (ex: Televisores)">
      <button class="btn" id="cat-add" style="width:100%">Adicionar categoria</button>
      <div id="cat-lista"></div>
    </div>

    <div class="caixa">
      <h2>Novo produto</h2>
      <input type="text" id="p-nome" placeholder="Nome do produto">
      <input type="number" id="p-preco" placeholder="Preço (Kz)" inputmode="decimal">
      <input type="number" id="p-stock" placeholder="Quantidade em stock" inputmode="numeric">
      <select id="p-cat"></select>
      <textarea id="p-desc" rows="3" placeholder="Descrição"></textarea>
      <input type="text" id="p-foto" placeholder="Link da foto (cola o link da imagem)">
      <button class="btn" id="p-add" style="width:100%">Guardar produto</button>
    </div>

    <div class="caixa">
      <h2>Produtos</h2>
      <div id="p-lista"></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
