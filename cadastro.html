<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cadastro - Casa Nova</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabase.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,Arial,sans-serif;background:#f5f6f8;color:#1d2330}
.topo{display:flex;justify-content:space-between;align-items:center;padding:8px 16px;background:#0b5ed7;color:#fff;height:72px}
.topo .logo{display:flex;align-items:center}
.topo .logo-img{height:56px;width:auto;max-width:200px;object-fit:contain;display:none}
.topo.tem-logo .logo-text{display:none}
.topo .logo-text{font-size:1.3rem;font-weight:700}
.topo a{color:#fff;text-decoration:none;font-weight:700}
.container{max-width:480px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:16px;padding:20px;margin-top:16px}
.abas{display:flex;background:#eef2ff;border-radius:12px;padding:4px;margin-bottom:16px}
.aba{flex:1;padding:12px;border:0;border-radius:9px;background:transparent;font-weight:700;cursor:pointer}
.aba.ativa{background:#0b5ed7;color:#fff}
input{width:100%;padding:12px;border:1px solid #cfd5df;border-radius:10px;margin-bottom:10px;font-size:15px}
.btn{background:#0b5ed7;color:#fff;border:0;padding:14px;border-radius:12px;width:100%;font-weight:800;font-size:16px;cursor:pointer}
.btn-verde{background:#16a34a}
.erro{background:#fee2e2;color:#dc2626;padding:10px;border-radius:10px;font-size:13px;margin-bottom:10px;display:none}
.sucesso{background:#dcfce7;color:#15803d;padding:10px;border-radius:10px;font-size:13px;margin-bottom:10px;display:none}
small{color:#666;font-size:13px}
#toast{position:fixed;top:82px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:12px 18px;border-radius:30px;font-size:14px;z-index:200;opacity:0;transition:.3s;pointer-events:none}
#toast.mostrar{opacity:1}
</style>
</head>
<body>
<div class="topo" id="topoSite">
  <a class="logo" href="index.html">
    <img id="logoTopo" class="logo-img" src="">
    <span class="logo-text">⬅ Casa Nova</span>
  </a>
  <a href="index.html">Loja</a>
</div>

<div class="container">
  <h1 style="font-size:1.4rem">Minha Conta</h1>
  <p style="color:#666;font-size:13px;margin-top:4px">Cria conta ou entra para comprar mais rápido.</p>

  <div class="card">
    <div class="abas">
      <button class="aba ativa" id="abaCriar" onclick="trocarAba('criar')">Criar Conta</button>
      <button class="aba" id="abaEntrar" onclick="trocarAba('entrar')">Entrar</button>
    </div>

    <div id="erroBox" class="erro"></div>
    <div id="okBox" class="sucesso"></div>

    <!-- CRIAR CONTA -->
    <div id="boxCriar">
      <input id="nomeCriar" placeholder="Nome completo *">
      <input id="telefoneCriar" placeholder="Telefone / WhatsApp *">
      <input id="emailCriar" type="email" placeholder="Email *">
      <input id="moradaCriar" placeholder="Morada / Bairro">
      <input id="senhaCriar" type="password" placeholder="Senha *">
      <input id="senha2Criar" type="password" placeholder="Repete a senha *">
      <button class="btn btn-verde" onclick="criarConta()">✅ Criar Minha Conta</button>
      <p style="text-align:center;margin-top:10px"><small>Já tens conta? <a href="#" onclick="trocarAba('entrar');return false" style="color:#0b5ed7;font-weight:700">Entra aqui</a></small></p>
    </div>

    <!-- ENTRAR -->
    <div id="boxEntrar" style="display:none">
      <input id="emailEntrar" type="email" placeholder="Email">
      <input id="senhaEntrar" type="password" placeholder="Senha">
      <button class="btn" onclick="entrar()">Entrar →</button>
      <p style="text-align:center;margin-top:10px"><small>Não tens conta? <a href="#" onclick="trocarAba('criar');return false" style="color:#0b5ed7;font-weight:700">Cria aqui</a></small></p>
    </div>

    <hr style="margin:16px 0;border:0;border-top:1px solid #eee">
    <button class="btn" style="background:#eee;color:#111" onclick="continuarSemConta()">🛒 Continuar sem conta →</button>
    <p style="text-align:center;margin-top:8px"><small>Vais poder preencher os dados no carrinho.</small></p>
  </div>
</div>

<div id="toast"></div>
<script>
function toast(m){ let t=document.getElementById('toast'); t.textContent=m; t.classList.add('mostrar'); setTimeout(()=>t.classList.remove('mostrar'),2500); }
function mostrarErro(m){ let e=document.getElementById('erroBox'); e.textContent=m; e.style.display='block'; document.getElementById('okBox').style.display='none'; }
function mostrarOk(m){ let e=document.getElementById('okBox'); e.textContent=m; e.style.display='block'; document.getElementById('erroBox').style.display='none'; }

function trocarAba(aba){
  document.getElementById('abaCriar').classList.toggle('ativa', aba==='criar');
  document.getElementById('abaEntrar').classList.toggle('ativa', aba==='entrar');
  document.getElementById('boxCriar').style.display = aba==='criar' ? 'block' : 'none';
  document.getElementById('boxEntrar').style.display = aba==='entrar' ? 'block' : 'none';
}
// Se veio do carrinho: cadastro.html?aba=entrar
let params = new URLSearchParams(location.search);
if(params.get('aba')==='entrar') trocarAba('entrar');

async function criarConta(){
  let nome = document.getElementById('nomeCriar').value.trim();
  let telefone = document.getElementById('telefoneCriar').value.trim();
  let email = document.getElementById('emailCriar').value.trim().toLowerCase();
  let morada = document.getElementById('moradaCriar').value.trim();
  let senha = document.getElementById('senhaCriar').value;
  let senha2 = document.getElementById('senha2Criar').value;
  if(!nome || !telefone || !email || !senha){ mostrarErro('⚠️ Preenche nome, telefone, email e senha!'); return; }
  if(senha !== senha2){ mostrarErro('⚠️ As senhas não são iguais!'); return; }
  if(senha.length < 4){ mostrarErro('⚠️ Senha muito curta, usa 4+ caracteres!'); return; }

  let cliente = {nome, telefone, email, morada, senha};
  // Guarda no telemóvel - é isto que o carrinho lê
  localStorage.setItem('cliente_casa_nova', JSON.stringify(cliente));

  // Tenta guardar também no Supabase (se a tabela existir)
  try{
    if(typeof db !== 'undefined'){
      await db.from('clientes').insert([{nome, telefone, email, morada, senha}]);
    }
  }catch(e){ console.log('Supabase clientes:', e.message); }

  mostrarOk('✅ Conta criada! A entrar...');
  toast('✅ Conta criada!');
  setTimeout(()=>{ location.href = 'index.html'; }, 800);
}

async function entrar(){
  let email = document.getElementById('emailEntrar').value.trim().toLowerCase();
  let senha = document.getElementById('senhaEntrar').value;
  if(!email || !senha){ mostrarErro('⚠️ Preenche email e senha!'); return; }

  // 1. Tenta no telemóvel
  try{
    let salvo = JSON.parse(localStorage.getItem('cliente_casa_nova')||'null');
    if(salvo && salvo.email === email && salvo.senha === senha){
      mostrarOk('✅ Bem-vindo de volta, ' + salvo.nome + '!');
      setTimeout(()=>{ location.href = 'index.html'; }, 600);
      return;
    }
  }catch(e){}

  // 2. Tenta no Supabase
  try{
    if(typeof db !== 'undefined'){
      let {data} = await db.from('clientes').select('*').eq('email', email).eq('senha', senha).maybeSingle();
      if(data){
        localStorage.setItem('cliente_casa_nova', JSON.stringify(data));
        mostrarOk('✅ Bem-vindo de volta, ' + (data.nome||'') + '!');
        setTimeout(()=>{ location.href = 'index.html'; }, 600);
        return;
      }
    }
  }catch(e){ console.log(e); }

  mostrarErro('⚠️ Email ou senha errada! Se ainda não tens conta, cria uma.');
}

function continuarSemConta(){
  location.href = 'index.html';
}

async function carregarLogoTopo(){
  try{
    if(typeof db === 'undefined') return;
    let r = await db.from('loja_config').select('logo_url').eq('id',1).maybeSingle();
    if(r.data?.logo_url){
      let img = document.getElementById('logoTopo');
      img.src = r.data.logo_url; img.style.display='block';
      document.getElementById('topoSite').classList.add('tem-logo');
    }
  }catch(e){}
}
carregarLogoTopo();
</script>
</body>
</html>
