<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carrinho - Casa Nova</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f1f3f6}
.topo{background:#2563eb;color:#fff;padding:12px;display:flex;justify-content:space-between;align-items:center}
.topo a{color:#fff;text-decoration:none;font-weight:700}
.container{padding:12px}
.caixa{background:#fff;padding:16px;border-radius:12px;margin-bottom:12px}
.linha{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid #eef0f4}
.btn{background:#16a34a;color:#fff;border:0;padding:12px;border-radius:8px;width:100%;font-weight:700;cursor:pointer;font-size:1rem}
.btn2{border:0;padding:8px 12px;border-radius:8px;background:#eef0f4;cursor:pointer}
input,textarea,select{width:100%;padding:11px;margin-bottom:8px;border:1px solid #cfd5df;border-radius:8px;font-size:1rem}
</style>
</head>
<body>
<header class="topo"><a href="index.html">⬅ Casa Nova</a><a href="index.html">Loja</a></header>
<main class="container">
<h2 style="margin:12px 0">Meu Carrinho</h2>
<div id="lista"></div>
<div class="caixa">
<h3>Dados de Entrega</h3>
<input id="nome" placeholder="Teu nome completo">
<input id="telefone" placeholder="Teu telefone / WhatsApp">
<textarea id="morada" rows="2" placeholder="Morada de entrega"></textarea>
<select id="pagamento"><option>Multicaixa Express</option><option>Dinheiro na entrega</option><option>Transferência</option></select>
<p id="total" style="font-weight:700;font-size:1.2rem"></p>
<button class="btn" id="finalizar">Finalizar Pedido no WhatsApp</button>
</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabase.js"></script>
<script>
function lerCarrinho(){try{return JSON.parse(localStorage.getItem('carrinho')||'[]')}catch(e){return[]}}
function gravarCarrinho(c){localStorage.setItem('carrinho',JSON.stringify(c))}
function kz(v){return Number(v).toLocaleString()+' Kz'}
function mostrar(){
  var c = lerCarrinho();
  var div = document.getElementById("lista");
  if(c.length === 0){ div.innerHTML = "<div class='caixa'>Carrinho vazio. Volta à loja.</div>"; document.getElementById("total").textContent=""; return; }
  var total = 0;
  div.innerHTML = c.map(function(it, i){
    total += it.preco * it.qtd;
    return "<div class='caixa linha'><div><b>"+it.nome+"</b><br>"+kz(it.preco)+" x "+it.qtd+"</div><div><button class='btn2' onclick='mudar("+i+",1)'>+</button> <button class='btn2' onclick='mudar("+i+",-1)'>-</button> <button class='btn2' onclick='remover("+i+")'>X</button></div></div>";
  }).join("");
  document.getElementById("total").textContent = "Total: " + kz(total);
}
function mudar(i, d){
  var c = lerCarrinho(); c[i].qtd += d;
  if(c[i].qtd <= 0) c.splice(i,1);
  gravarCarrinho(c); mostrar();
}
function remover(i){ var c = lerCarrinho(); c.splice(i,1); gravarCarrinho(c); mostrar(); }
document.getElementById("finalizar").onclick = async function(){
  var c = lerCarrinho();
  if(c.length === 0) return alert("Carrinho vazio");
  var nome = document.getElementById("nome").value.trim();
  var tel = document.getElementById("telefone").value.trim();
  var morada = document.getElementById("morada").value.trim();
  var pagamento = document.getElementById("pagamento").value;
  if(!nome || !tel) return alert("Preenche nome e telefone");
  var total = 0; var msg = "NOVO PEDIDO - CASA NOVA%0A%0A";
  c.forEach(function(it){ total += it.preco * it.qtd; msg += "- " + it.nome + " x " + it.qtd + " = " + kz(it.preco*it.qtd) + "%0A"; });
  msg += "%0ATotal: " + kz(total) + "%0ANome: " + nome + "%0ATelefone: " + tel + "%0AMorada: " + morada + "%0APagamento: " + pagamento;
  await db.from("clientes").upsert([{nome: nome, telefone: tel}], {onConflict:'telefone'});
  var itensSalvar = c.map(function(it){ return { nome: it.nome, preco: it.preco, qtd: it.qtd }; });
  var r = await db.from("pedidos").insert([{nome: nome, telefone: tel, morada: morada + " | Pagamento: " + pagamento, itens: itensSalvar, total: total}]);
  if(r.error){ alert("Erro ao gravar pedido: " + r.error.message); return; }
  localStorage.removeItem("carrinho");
  window.open("https://wa.me/244972370499?text=" + msg, "_blank");
  setTimeout(function(){ window.location.href = "index.html"; }, 1000);
};
mostrar();
</script>
</body>
</html>
