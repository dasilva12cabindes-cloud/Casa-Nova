<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meu Carrinho - Casa Nova</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabase.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,Arial,sans-serif;background:#f5f6f8;color:#1d2330}
.topo{display:flex;justify-content:space-between;align-items:center;padding:8px 16px;background:#0b5ed7;color:#fff;height:72px}
.topo .logo{display:flex;align-items:center}
.topo .logo-img{height:56px;width:auto;max-width:200px;object-fit:contain;display:block}
.topo .logo-text{font-size:1.3rem;font-weight:700}
.topo.tem-logo .logo-text{display:none}
.topo a{color:#fff;text-decoration:none;font-weight:700}
.container{max-width:600px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin-bottom:12px}
.cliente-box{background:#e0f2fe;border:1px solid #93c5fd;padding:12px;border-radius:12px;margin-bottom:12px;font-size:14px}
.aviso-login{background:#fef3c7;border:1px solid #fbbf24;padding:12px;border-radius:12px;margin-bottom:12px;font-size:14px}
.item{background:#fff;border-radius:14px;padding:12px;margin-bottom:10px;display:flex;gap:10px;align-items:center}
.item img{width:70px;height:70px;object-fit:cover;border-radius:10px;background:#eee}
.item-info{flex:1}
.item-info b{font-size:15px;display:block}
.item-info span{color:#0b5ed7;font-weight:700}
.qtd{display:flex;gap:6px;align-items:center}
.qtd button{width:32px;height:32px;border:0;border-radius:8px;background:#eef2ff;font-size:18px;cursor:pointer}
.qtd .remover{background:#fee2e2;color:#dc2626}
.form{background:#fff;border-radius:16px;padding:16px;margin-top:10px}
.form h3{margin-bottom:12px}
.form input,.form select,.form textarea{width:100%;padding:12px;border:1px solid #cfd5df;border-radius:10px;margin-bottom:10px;font-size:15px}
.form label{font-weight:700;font-size:14px;display:block;margin:12px 0 6px}
.total{font-size:1.2rem;font-weight:800;margin:12px 0}
.btn-whats{background:#0b5ed7;color:#fff;border:0;padding:14px;border-radius:12px;width:100%;font-weight:800;font-size:16px;cursor:pointer}
.btn-limpar{background:#eee;border:0;padding:10px;border-radius:10px;width:100%;margin-top:8px;cursor:pointer}
.vazio{text-align:center;padding:30px;color:#666}
.erro{background:#fee2e2;color:#dc2626;padding:10px;border-radius:10px;font-size:13px;margin-bottom:10px;display:none}
#infoPagamento{background:#e0f2fe;border:1px solid #93c5fd;padding:12px;border-radius:10px;font-size:14px;margin-bottom:10px;display:none;line-height:1.7}
#toast{position:fixed;top:82px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:12px 18px;border-radius:30px;font-size:14px;z-index:200;opacity:0;transition:.3s;pointer-events:none}
#toast.mostrar{opacity:1}
.modal-fundo{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px}
.modal-fundo.aberto{display:flex}
.modal-box{background:#fff;width:100%;max-width:350px;border-radius:20px;padding:22px;text-align:center}
</style>
</head>
<body>
<div class="topo" id="topoSite">
  <a class="logo" href="index.html">
    <img id="logoTopo" class="logo-img" src="" alt="Casa Nova" style="display:none">
    <span class="logo-text" id="nomeTopo">⬅ Casa Nova</span>
  </a>
  <a href="index.html">Loja</a>
</div>
<div class="container">
<h1>Meu Carrinho</h1>
<div id="infoCliente" class="cliente-box" style="display:none"></div>
<div id="avisoLogin" class="aviso-login" style="display:none">👋 Já tens conta? <a href="cadastro.html?aba=entrar" style="color:#0b5ed7;font-weight:800">Entra aqui</a> para preencher os teus dados sozinho. Ou preenche em baixo para fazer o pedido.</div>
<div id="lista"></div>
<div id="formBox" class="form" style="display:none">
  <h3>Dados de Entrega</h3>
  <div id="erroForm" class="erro"></div>
  <input id="nome" placeholder="Teu nome completo">
  <input id="telefone" placeholder="Teu telefone / WhatsApp">
  <textarea id="morada" placeholder="Morada de entrega" rows="2"></textarea>

  <!-- RETIFICADO: PAGAMENTO VEM DO ADMIN -->
  <label>💳 Forma de Pagamento</label>
  <select id="pagamento" onchange="mostrarInfoPagamento()"></select>
  <div id="infoPagamento"></div>

  <div class="total" id="total">Total: 0 Kz</div>
  <button class="btn-whats" onclick="finalizar()">Finalizar Pedido no WhatsApp</button>
  <button class="btn-limpar" onclick="abrirLimpar()">🗑️ Limpar Carrinho</button>
</div>
<div id="vazio" class="vazio" style="display:none">O teu carrinho está vazio.<br><br><a href="index.html" style="color:#0b5ed7;font-weight:700">⬅ Voltar à Loja</a></div>
</div>
<div id="modalLimpar" class="modal-fundo" onclick="if(event.target.id==='modalLimpar') fecharLimpar()">
  <div class="modal-box">
    <div style="font-size:40px">🗑️</div>
    <h3 style="margin:8px 0">Limpar todo o carrinho?</h3>
    <button class="btn-whats" style="background:#dc2626" onclick="confirmarLimpar()">Sim, Limpar</button>
    <button class="btn-limpar" onclick="fecharLimpar()">Cancelar</button>
  </div>
</div>
<div id="modalFinalizar" class="modal-fundo" onclick="if(event.target.id==='modalFinalizar') fecharFinalizar()">
  <div class="modal-box">
    <div style="font-size:40px">🛒</div>
    <h3 style="margin:8px 0">Confirmar pedido?</h3>
    <p style="color:#666;font-size:14px;margin-bottom:16px" id="textoFinalizar">Vais ser levado para o WhatsApp.</p>
    <button class="btn-whats" onclick="confirmarFinalizar()">Sim, Enviar</button>
    <button class="btn-limpar" onclick="fecharFinalizar()">Cancelar</button>
  </div>
</div>
<div id="toast"></div>
<script>
function mostrarToast(m){ let t=document.getElementById('toast'); t.textContent=m; t.classList.add('mostrar'); setTimeout(()=>t.classList.remove('mostrar'),2500); }
function getCarrinho(){ try{ return JSON.parse(localStorage.getItem('carrinho')||'[]'); }catch(e){ return []; } }
function setCarrinho(c){ localStorage.setItem('carrinho', JSON.stringify(c)); }

// CORRIGIDO: NÃO MANDA MAIS PARA O CADASTRO
let cliente = null;
try{ cliente = JSON.parse(localStorage.getItem('cliente_casa_nova')||'null'); }catch(e){ cliente=null; }

// ===== RETIFICADO: SISTEMA DE PAGAMENTO + WHATSAPP DO ADMIN =====
let _pagAtivos = [];
let _whatsLoja = localStorage.getItem('whatsapp_loja') || '';

function carregarPagamentosCarrinho(){
  let select = document.getElementById('pagamento');
  let lista = [];
  try{ lista = JSON.parse(localStorage.getItem('pagamentos_casa_nova')||'[]'); }catch(e){}
  // Se ainda não adicionaste nenhum no admin, mostra os 4 padrões vazios
  if(!lista.length){
    lista = [
      {tipo:'Multicaixa Express', telefone:'', nome:'', ativo:true},
      {tipo:'PayPay', referencia:'', telefone:'', ativo:true},
      {tipo:'IBAN', iban:'', nome:'', ativo:true},
      {tipo:'Dinheiro na Entrega', ativo:true}
    ];
  }
  _pagAtivos = lista.filter(p=>p.ativo);
  select.innerHTML = _pagAtivos.map(p=>`<option value="${p.tipo}">${p.tipo}</option>`).join('');
  mostrarInfoPagamento();
}
function mostrarInfoPagamento(){
  let select = document.getElementById('pagamento');
  let div = document.getElementById('infoPagamento');
  let p = _pagAtivos.find(x=>x.tipo===select.value);
  if(!p){ div.style.display='none'; return; }
  let txt = '';
  if(p.tipo==='Multicaixa Express') txt = `<b>📱 Multicaixa Express</b><br>📞 Telefone: <b>${p.telefone||'---'}</b><br>👤 Nome: <b>${p.nome||'---'}</b>`;
  else if(p.tipo==='PayPay') txt = `<b>💸 PayPay</b><br>🔢 Referência: <b>${p.referencia||p.conta||'---'}</b><br>📞 Telefone: <b>${p.telefone||'---'}</b>`;
  else if(p.tipo==='IBAN') txt = `<b>🏦 IBAN</b><br>🏦 IBAN: <b>${p.iban||p.conta||'---'}</b><br>👤 Nome: <b>${p.nome||p.titular||'---'}</b>`;
  else txt = `<b>💵 Dinheiro na Entrega</b><br>Paga quando receberes a encomenda.`;
  div.innerHTML = txt; div.style.display='block';
}
async function carregarWhatsAppLoja(){
  // 1. Já tem no localStorage (guardado no admin)
  if(_whatsLoja) return;
  // 2. Tenta buscar no Supabase loja_config
  try{
    if(typeof db !== 'undefined'){
      let r = await db.from('loja_config').select('whatsapp').eq('id',1).maybeSingle();
      if(r.data && r.data.whatsapp){ _whatsLoja = r.data.whatsapp; localStorage.setItem('whatsapp_loja', _whatsLoja); }
    }
  }catch(e){}
}
function getWhatsAppLoja(){
  return _whatsLoja || localStorage.getItem('whatsapp_loja') || '244942788931';
}

async function corrigirItensAntigos(){
  let carrinho = getCarrinho();
  let precisa = carrinho.some(i=>!i.nome || !i.preco);
  if(precisa && typeof db !== 'undefined'){
    try{
      let ids = carrinho.map(i=>i.id);
      let { data } = await db.from('produtos').select('id,nome,preco,imagem,imagem_url').in('id', ids);
      if(data){
        carrinho = carrinho.map(item=>{
          let p = data.find(x=>x.id==item.id);
          if(p) return {...item, nome:p.nome, preco:Number(p.preco), imagem:p.imagem||p.imagem_url||''};
          return item;
        });
        setCarrinho(carrinho);
      }
    }catch(e){ console.log(e); }
  }
  return carrinho;
}
async function renderizar(){
  let carrinho = await corrigirItensAntigos();
  let lista = document.getElementById('lista');
  let formBox = document.getElementById('formBox');
  let vazio = document.getElementById('vazio');
  if(cliente){
    document.getElementById('infoCliente').style.display='block';
    document.getElementById('infoCliente').innerHTML = `👤 Comprando como: <b>${cliente.nome||cliente.nome_cliente||''}</b><br>📧 ${cliente.email||''} • 📞 ${cliente.telefone||''}`;
    document.getElementById('nome').value = cliente.nome||cliente.nome_cliente||'';
    document.getElementById('telefone').value = cliente.telefone||'';
    document.getElementById('morada').value = cliente.morada||'';
    document.getElementById('avisoLogin').style.display='none';
  } else {
    document.getElementById('infoCliente').style.display='none';
    document.getElementById('avisoLogin').style.display='block';
  }
  if(!carrinho.length){ lista.innerHTML=''; formBox.style.display='none'; vazio.style.display='block'; return; }
  vazio.style.display='none'; formBox.style.display='block';
  let total = 0;
  lista.innerHTML = carrinho.map((item, idx)=>{
    let preco = Number(item.preco||0); let qtd = Number(item.qtd||1); total += preco*qtd;
    return `<div class="item"><img src="${item.imagem||'https://via.placeholder.com/100'}" onerror="this.src='https://via.placeholder.com/100'"><div class="item-info"><b>${item.nome||'Produto'}</b><span>${preco.toLocaleString()} Kz x ${qtd}</span><br><small>= ${(preco*qtd).toLocaleString()} Kz</small></div><div class="qtd"><button onclick="mudarQtd(${idx},1)">+</button><button onclick="mudarQtd(${idx},-1)">-</button><button class="remover" onclick="remover(${idx})">X</button></div></div>`;
  }).join('');
  document.getElementById('total').textContent = 'Total: ' + total.toLocaleString() + ' Kz';
}
function mudarQtd(idx, delta){ let c = getCarrinho(); c[idx].qtd = (c[idx].qtd||1) + delta; if(c[idx].qtd <= 0) c.splice(idx,1); setCarrinho(c); renderizar(); }
function remover(idx){ let c = getCarrinho(); c.splice(idx,1); setCarrinho(c); renderizar(); }
function abrirLimpar(){ document.getElementById('modalLimpar').classList.add('aberto'); }
function fecharLimpar(){ document.getElementById('modalLimpar').classList.remove('aberto'); }
function confirmarLimpar(){ fecharLimpar(); setCarrinho([]); renderizar(); mostrarToast('🗑️ Carrinho limpo'); }
function finalizar(){
  let carrinho = getCarrinho(); let erro = document.getElementById('erroForm'); erro.style.display='none';
  if(!carrinho.length){ mostrarToast('🛒 Carrinho vazio'); return; }
  let nome = document.getElementById('nome').value.trim();
  let telefone = document.getElementById('telefone').value.trim();
  let morada = document.getElementById('morada').value.trim();
  if(!nome || !telefone || !morada){ erro.textContent='⚠️ Preenche nome, telefone e morada!'; erro.style.display='block'; return; }
  if(!cliente){
    let novoCliente = {nome, telefone, morada, email: '', senha: ''};
    localStorage.setItem('cliente_casa_nova', JSON.stringify(novoCliente));
    cliente = novoCliente;
  }
  let total = carrinho.reduce((s,i)=>s + Number(i.preco||0)*(i.qtd||1), 0);
  document.getElementById('textoFinalizar').textContent = 'Total: ' + total.toLocaleString() + ' Kz • ' + carrinho.length + ' produto(s). Vais ser levado para o WhatsApp.';
  document.getElementById('modalFinalizar').classList.add('aberto');
}
function fecharFinalizar(){ document.getElementById('modalFinalizar').classList.remove('aberto'); }
function confirmarFinalizar(){
  fecharFinalizar();
  let carrinho = getCarrinho();
  let nome = document.getElementById('nome').value.trim();
  let telefone = document.getElementById('telefone').value.trim();
  let morada = document.getElementById('morada').value.trim();
  let pagamento = document.getElementById('pagamento').value;
  let total = carrinho.reduce((s,i)=>s + Number(i.preco||0)*(i.qtd||1), 0);
  // Detalhe do pagamento que vai no WhatsApp
  let pag = _pagAtivos.find(x=>x.tipo===pagamento);
  let detalhePag = '';
  if(pag){
    if(pag.tipo==='Multicaixa Express') detalhePag = `\n📱 Multicaixa Express: ${pag.telefone||''} (${pag.nome||''})`;
    else if(pag.tipo==='PayPay') detalhePag = `\n💸 PayPay - Ref: ${pag.referencia||pag.conta||''} | Tel: ${pag.telefone||''}`;
    else if(pag.tipo==='IBAN') detalhePag = `\n🏦 IBAN: ${pag.iban||pag.conta||''} (${pag.nome||pag.titular||''})`;
    else detalhePag = `\n💵 Paga na entrega`;
  }
  let msg = `🛒 *NOVO PEDIDO - CASA NOVA*\n\n👤 Cliente: ${nome}\n📞 ${telefone}\n📍 ${morada}\n💳 Pagamento: ${pagamento}${detalhePag}\n\n📦 *Produtos:*\n` + carrinho.map(i=>`• ${i.nome} - ${Number(i.preco).toLocaleString()} Kz x ${i.qtd} = ${(Number(i.preco)*(i.qtd||1)).toLocaleString()} Kz`).join('\n') + `\n\n💰 *Total: ${total.toLocaleString()} Kz*`;
  // RETIFICADO: usa o WhatsApp do admin, não o número fixo
  let numero = getWhatsAppLoja();
  window.open('https://wa.me/'+numero+'?text='+encodeURIComponent(msg), '_blank');
}
async function carregarLogoTopo(){
  try{
    if(typeof db === 'undefined') return;
    const r = await db.from('loja_config').select('*').eq('id',1).maybeSingle();
    let cfg = r.data || {};
    if(cfg.logo_url){
      let logo = document.getElementById('logoTopo');
      logo.src = cfg.logo_url; logo.style.display = 'block';
      document.getElementById('topoSite').classList.add('tem-logo');
    }
    if(cfg.whatsapp){ _whatsLoja = cfg.whatsapp; localStorage.setItem('whatsapp_loja', cfg.whatsapp); }
  }catch(e){ console.log(e); }
}
carregarLogoTopo();
carregarPagamentosCarrinho();
carregarWhatsAppLoja();
renderizar();
</script>
</body>
</html>
