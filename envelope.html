<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notificações</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f6f8}
.topo{background:#0b5ed7;color:#fff;padding:15px;display:flex;align-items:center;gap:10px}
.topo button{background:#fff;color:#111;border:0;padding:8px 12px;border-radius:20px;font-weight:bold}
.topo h2{margin:0;font-size:18px;flex:1}
.caixa{max-width:480px;margin:15px auto;padding:0 12px}
.card{background:#fff;border-radius:14px;padding:15px;margin-bottom:12px}
.codigo{background:#eef7ff;border:1px dashed #2196f3;color:#0b6fc2;padding:10px;border-radius:10px;margin-top:10px;font-weight:bold;text-align:center}
.badge{display:inline-block;background:#ffecb3;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:bold;margin-top:8px}
.btn{width:100%;background:#111;color:#fff;border:0;padding:13px;border-radius:12px;font-weight:bold;margin-top:10px}
</style>
</head>
<body>
<div class="topo"><button onclick="location.href='index.html'">← Voltar</button><h2>📩 Notificações</h2></div>
<div class="caixa" id="conteudo"><p>A carregar...</p></div>
<script>
const SUPABASE_URL = "COLA_AQUI_TUA_URL";
const SUPABASE_KEY = "COLA_AQUI_TUA_ANON_KEY";

async function carregar(){
  let cliente=null;
  try{ cliente = JSON.parse(localStorage.getItem('cliente_casa_nova')||'null'); }catch(e){}
  let div=document.getElementById('conteudo');
  if(!cliente){ 
    localStorage.setItem('notificacoes_casa_nova', JSON.stringify([]));
    div.innerHTML='<div class="card">Faz login para veres as notificações.<button class="btn" onclick="location.href=\'cadastro.html\'">Ir para Login</button></div>'; 
    return; 
  }

  // SE AINDA NÃO COLASTE A URL DO SUPABASE, NÃO FICA PRESO
  if(SUPABASE_URL.includes("COLA_AQUI")){
    localStorage.setItem('notificacoes_casa_nova', JSON.stringify([]));
    div.innerHTML='<div class="card">Olá, <b>'+(cliente.nome||'Cliente')+'</b><br><br>Não tens notificações pendentes.</div><button class="btn" onclick="location.href=\'meus-pedidos.html\'">Ver Meus Códigos</button>';
    return;
  }

  try{
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let { data, error } = await supabase.from('pedidos_casa_nova').select('*').order('created_at',{ascending:false});
    if(error) throw error;

    let meus = data.filter(p=>{
      let eNome = (p.cliente_nome||'').toLowerCase() === (cliente.nome||'').toLowerCase();
      let eTel = cliente.telefone && p.cliente_telefone && p.cliente_telefone.includes(cliente.telefone.slice(-9));
      return eNome || eTel;
    });
    let ativos = meus.filter(p=> !/entregue|conclu|finaliz|cancelado/i.test(p.status||''));

    let html='<p>Olá, <b>'+(cliente.nome||'Cliente')+'</b></p>';
    if(ativos.length){
      html+=ativos.map(p=>'<div class="card">📩 '+(p.mensagem||'O teu pedido foi atualizado')+'<br><span class="badge">📌 Pedido Nº: '+p.codigo+'</span><div class="codigo">'+p.status+'</div></div>').join('');
    } else {
      html+='<div class="card">Não tens notificações pendentes. Os pedidos entregues foram apagados automaticamente.</div>';
    }
    html+='<button class="btn" onclick="location.href=\'meus-pedidos.html\'">Ver Meus Códigos</button>';
    div.innerHTML=html;
    localStorage.setItem('notificacoes_casa_nova', JSON.stringify(ativos));
  }catch(err){
    localStorage.setItem('notificacoes_casa_nova', JSON.stringify([]));
    div.innerHTML='<div class="card">Não tens notificações pendentes.</div><button class="btn" onclick="location.href=\'meus-pedidos.html\'">Ver Meus Códigos</button>';
  }
}
carregar();
</script>
</body>
</html>
