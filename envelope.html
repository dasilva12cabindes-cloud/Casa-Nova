<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notificações - Casa Nova</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f6f8}
.topo{background:#0b5ed7;color:#fff;padding:15px;display:flex;align-items:center;gap:10px}
.topo button{background:#fff;color:#111;border:0;padding:8px 12px;border-radius:20px;font-weight:bold;cursor:pointer}
.topo h2{margin:0;font-size:18px;flex:1}
.caixa{max-width:480px;margin:15px auto;padding:0 12px}
.card{background:#fff;border-radius:14px;padding:15px;margin-bottom:12px}
.codigo{background:#eef7ff;border:1px dashed #2196f3;color:#0b6fc2;padding:10px;border-radius:10px;margin-top:10px;font-weight:bold;text-align:center}
.badge{display:inline-block;background:#ffecb3;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:bold;margin-top:8px}
.btn{width:100%;background:#111;color:#fff;border:0;padding:13px;border-radius:12px;font-weight:bold;margin-top:10px;cursor:pointer}
</style>
</head>
<body>
<div class="topo"><button onclick="location.href='index.html'">← Voltar</button><h2>📩 Notificações</h2><span>✉️</span></div>
<div class="caixa" id="conteudo"></div>
<script>
function clienteLogado(){ try{ return JSON.parse(localStorage.getItem('cliente_casa_nova')||'null'); }catch(e){ return null; } }
function pegarCodigos(){
  let c=[];
  try{ c=c.concat(JSON.parse(localStorage.getItem('meus_pedidos')||'[]')); }catch(e){}
  try{ c=c.concat(JSON.parse(localStorage.getItem('meus_codigos')||'[]')); }catch(e){}
  try{ let u=localStorage.getItem('ultimo_pedido_codigo'); if(u) c.push(u); }catch(e){}
  try{ c=c.concat(Object.keys(JSON.parse(localStorage.getItem('casanova_status_pedidos')||'{}'))); }catch(e){}
  return [...new Set(c.filter(Boolean))];
}
function normalizar(s){ return (s||'').toLowerCase().trim(); }
function eFinal(status){
  let s=normalizar(status);
  return s.includes('entregue') || s.includes('conclu') || s.includes('finaliz') || s.includes('confirmado tudo') || s.includes('confirmado - tudo') || s==='confirmado';
}
var cliente=clienteLogado();
var div=document.getElementById('conteudo');
if(!cliente){
  div.innerHTML='<div class="card"><h3>Sem login</h3><p>Faz login para veres as tuas notificações.</p><button class="btn" onclick="location.href=\'cadastro.html\'">Ir para Login</button></div>';
} else {
  var notifs=[]; try{ notifs=JSON.parse(localStorage.getItem('notificacoes_casa_nova')||'[]'); }catch(e){}
  var status={}; try{ status=JSON.parse(localStorage.getItem('casanova_status_pedidos')||'{}'); }catch(e){}
  var codigos=pegarCodigos();

  // 1. Tira duplicadas
  notifs=[...new Map(notifs.map(n=>[(n.mensagem||n.texto||'')+'|'+(n.codigo||n.pedido||''),n])).values()];

  // 2. Só apaga automaticamente se o Admin confirmou TUDO / Entregue
  // Enquanto estiver em Preparação ou Pagamento Recebido, MANTÉM
  var ativas = notifs.filter(n=>{
    let cod = n.codigo || n.pedido || n.codigo_pedido || '';
    let st = n.status || status[cod] || '';
    return !eFinal(st);
  });
  // Guarda só as ativas - as finalizadas desaparecem sozinhas
  localStorage.setItem('notificacoes_casa_nova', JSON.stringify(ativas));

  var html='<p>Olá, <b>'+(cliente.nome||cliente.nome_cliente||'Cliente')+'</b></p>';
  if(ativas.length){
    html+=ativas.map(n=>{
      let cod = n.codigo || n.pedido || n.codigo_pedido || codigos[0] || '';
      let st = n.status || status[cod] || 'Está a ser preparado';
      // Se a mensagem não tem código, usa o último código
      return '<div class="card">📩 '+(n.mensagem||n.texto||'Teu pedido foi atualizado')+
      '<br><span class="badge">📌 Pedido Nº: '+(cod||'---')+'</span>'+
      '<div class="codigo">'+st+'</div></div>';
    }).join('');
  } else if(codigos.length){
    // Se não há mensagem do admin mas há pedido, mostra o pedido com nº no fim
    html+=codigos.map(c=>{
      let st=status[c]||'Está a ser preparado';
      if(eFinal(st)) return '';
      return '<div class="card">📩 O teu pedido está a ser preparado'+
      '<br><span class="badge">📌 Pedido Nº: '+c+'</span>'+
      '<div class="codigo">'+st+'</div></div>';
    }).join('');
  }
  if(!ativas.length && !codigos.filter(c=>!eFinal(status[c]||'')).length){
    html+='<div class="card">Não tens notificações pendentes. Quando o Admin confirmar tudo, as mensagens são apagadas automaticamente.</div>';
  }
  html+='<button class="btn" onclick="location.href=\'meus-pedidos.html\'">Ver Meus Códigos / Pedidos</button>';
  div.innerHTML=html;
}
</script>
</body>
</html>
