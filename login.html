<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar - Casa Nova</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .topo{display:flex;justify-content:space-between;align-items:center;padding:8px 16px;background:#0b5ed7;color:#fff;height:72px}
    .topo .logo{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-weight:700;font-size:1.3rem}
    .topo .logo-img{height:56px;width:auto;max-width:200px;object-fit:contain;display:none;transform-origin:center;animation:logoZoom 4s ease-in-out infinite}
    .topo.tem-logo .logo-text{display:none}
    /* LOGOTIPO EM TODO O SITE - ZOOM GRANDE + AGITA + AMORTECEDOR */
    @keyframes logoZoom{
      0%{transform:scale(0.7) translateY(0) rotate(0deg)}
      25%{transform:scale(1.15) translateY(-3px) rotate(0deg)}
      40%{transform:scale(1.45) translateY(0) rotate(0deg)}
      48%{transform:scale(1.45) translateY(0) rotate(-6deg)}
      56%{transform:scale(1.45) translateY(0) rotate(6deg)}
      64%{transform:scale(1.45) translateY(0) rotate(-5deg)}
      72%{transform:scale(1.45) translateY(0) rotate(4deg)}
      80%{transform:scale(1.25) translateY(4px) rotate(0deg)}
      88%{transform:scale(1.08) translateY(-3px) rotate(0deg)}
      94%{transform:scale(0.96) translateY(2px) rotate(0deg)}
      100%{transform:scale(1) translateY(0) rotate(0deg)}
    }
    .caixa { max-width: 400px; margin: 24px auto; background: #fff; padding: 20px;
      border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .caixa h2 { background:#eff6ff;border:2px solid #0b5ed7;border-radius:999px;padding:10px 14px;text-align:center;margin-bottom: 14px; }
    .caixa input { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #cfd5df;
      border-radius: 8px; font-size: 1rem; }
    .caixa .btn { width: 100%; }
    .troca { display: block; text-align: center; margin-top: 14px; color: #0b5ed7; cursor: pointer; }
    #msg { margin-top: 10px; color: #c0392b; font-size: .95rem; }
  </style>
</head>
<body>
  <header class="topo" id="topoSite">
    <a href="index.html" class="logo"><img id="logoTopo" class="logo-img" src=""><span class="logo-text">Casa Nova</span></a>
    <a href="index.html" style="color:#fff;text-decoration:none;font-weight:700">← Loja</a>
  </header>

  <div class="caixa">
    <h2 id="titulo">Entrar</h2>
    <input type="text" id="nome" placeholder="O seu nome" style="display:none">
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="senha" placeholder="Senha (mínimo 6 caracteres)">
    <button class="btn" id="enviar">Entrar</button>
    <span class="troca" id="troca">Não tem conta? Criar conta</span>
    <p id="msg"></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script>
    var modoCadastro = false;
    var $ = function (id) { return document.getElementById(id); };

    $("troca").onclick = function () {
      modoCadastro = !modoCadastro;
      $("titulo").textContent = modoCadastro ? "Criar conta" : "Entrar";
      $("enviar").textContent = modoCadastro ? "Criar conta" : "Entrar";
      $("nome").style.display = modoCadastro ? "block" : "none";
      $("troca").textContent = modoCadastro ? "Já tem conta? Entrar" : "Não tem conta? Criar conta";
      $("msg").textContent = "";
    };

    $("enviar").onclick = async function () {
      var email = $("email").value.trim();
      var senha = $("senha").value;
      $("msg").textContent = "A processar...";
      var r;
      if (modoCadastro) {
        r = await db.auth.signUp({
          email: email, password: senha,
          options: { data: { nome: $("nome").value.trim() } }
        });
      } else {
        r = await db.auth.signInWithPassword({ email: email, password: senha });
      }
      if (r.error) { $("msg").textContent = r.error.message; return; }
      if (modoCadastro && !r.data.session) {
        $("msg").style.color = "#1e7e34";
        $("msg").textContent = "Conta criada! Confirme o email e depois entre.";
        return;
      }
      location.href = "index.html";
    };

    async function carregarLogoTopo(){
      try{
        let r = await db.from('loja_config').select('logo_url').eq('id',1).maybeSingle();
        let logo = r.data?.logo_url;
        if(logo){ let img=document.getElementById('logoTopo'); img.src=logo; img.style.display='block'; document.getElementById('topoSite').classList.add('tem-logo'); }
      }catch(e){}
    }
    carregarLogoTopo();
  </script>
</body>
</html>
