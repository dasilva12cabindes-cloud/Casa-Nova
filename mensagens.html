<!DOCTYPE html>
<html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mensagens - Casa Nova</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabase.js"></script>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f1f3f6;padding:12px}
.topo{background:#0b5ed7;color:#fff;padding:12px;border-radius:10px;display:flex;justify-content:space-between;align-items:center}
.topo a{color:#fff;text-decoration:none;font-weight:700}
.caixa{background:#fff;border-radius:12px;padding:12px;margin-top:12px;height:65vh;display:flex;flex-direction:column}
#chat{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.msg{max-width:80%;padding:10px 12px;border-radius:14px;font-size:15px}
.eu{background:#0b5ed7;color:#fff;align-self:flex-end}
.admin{background:#e5e7eb;align-self:flex-start}
.enviar{display:flex;gap:8px;margin-top:10px}
.enviar input{flex:1;padding:12px;border:1px solid #ccc;border-radius:10px}
.enviar button{background:#0b5ed7;color:#fff;border:0;padding:12px 16px;border-radius:10px;font-weight:700}
</style></head><body>
<div class="topo"><a href="index.html">← Loja</a><b>💬 Conversa com Admin</b><span></span></div>
<div class="caixa"><div id="chat"></div>
<div class="enviar"><input id="texto" placeholder="Escreve a tua mensagem..."><button onclick="enviar()">Enviar</button></div></div>
<script>
let meuId = localStorage.getItem('cliente_id') || localStorage.getItem('meu_id_online');
let meuNome = localStorage.getItem('cliente_nome') || localStorage.getItem('nome_cliente') || 'Cliente';
if(!meuId){ alert('Faz login primeiro para conversar!'); location.href='index.html'; }
async function carregar(){
  let r = await db.from('mensagens').select('*').eq('cliente_id', meuId).order('id',{ascending:true});
  let chat = document.getElementById('chat');
  chat.innerHTML = (r.data||[]).map(m=>`<div class="msg ${m.remetente=='cliente'?'eu':'admin'}">${m.texto}<br><small style="opacity:.7;font-size:11px">${new Date(m.created_at).toLocaleString('pt-PT')}</small></div>`).join('') || '<p style="text-align:center;color:#888">Nenhuma mensagem. Escreve a primeira!</p>';
  chat.scrollTop = chat.scrollHeight;
}
async function enviar(){
  let t = document.getElementById('texto').value.trim();
  if(!t) return;
  document.getElementById('texto').value='';
  await db.from('mensagens').insert({cliente_id: Number(meuId), cliente_nome: meuNome, remetente:'cliente', texto:t});
  carregar();
}
carregar(); setInterval(carregar, 2000);
</script></body></html>
