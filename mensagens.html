<!DOCTYPE html>
<html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Mensagens - Casa Nova</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabase.js"></script>
<style>*{box-sizing:border-box}html,body{touch-action:manipulation}body{margin:0;font-family:Arial;background:#f1f3f6;padding:12px;overscroll-behavior:none}
.topo{background:#0b5ed7;color:#fff;padding:12px;border-radius:10px;display:flex;justify-content:space-between;align-items:center}
.topo a{color:#fff;text-decoration:none;font-weight:700}
.caixa{background:#fff;border-radius:12px;padding:12px;margin-top:12px;height:65vh;display:flex;flex-direction:column}
#chat{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;overscroll-behavior:contain}
.msg{max-width:80%;padding:10px 12px;border-radius:14px;font-size:15px}
.eu{background:#0b5ed7;color:#fff;align-self:flex-end}
.admin{background:#e5e7eb;align-self:flex-start}
.enviar{display:flex;gap:8px;margin-top:10px}
.enviar input{flex:1;padding:12px;border:1px solid #ccc;border-radius:10px;font-size:16px !important}
.enviar button{background:#0b5ed7;color:#fff;border:0;padding:12px 16px;border-radius:10px;font-weight:700;font-size:16px}
#toastMsg{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#16a34a;color:#fff;padding:12px 16px;border-radius:12px;font-weight:800;display:none;z-index:9999}
</style></head><body>
<div id="toastMsg">💬 Nova mensagem do Admin!</div>
<div class="topo"><a href="index.html">← Loja</a><b>💬 Conversa com Admin</b><span id="badgeCli" style="background:#dc2626;color:#fff;padding:4px 10px;border-radius:999px;display:none">1 nova</span></div>
<div class="caixa"><div id="chat"></div>
<div class="enviar"><input id="texto" placeholder="Escreve a tua mensagem..." autocomplete="off"><button onclick="enviar()">Enviar</button></div></div>
<script>
// ID FIXO - nunca mais muda!
let meuId = localStorage.getItem('cliente_id') || localStorage.getItem('meu_id_online') || localStorage.getItem('id_cliente') || localStorage.getItem('clienteId');
if(!meuId){
  meuId = 'cli_' + Date.now() + '_' + Math.floor(Math.random()*9999);
}
localStorage.setItem('cliente_id', meuId);
localStorage.setItem('meu_id_online', meuId);

// 👇 PEGA O NOME DE TODOS OS LUGARES POSSÍVEIS
function pegarNome(){
  return localStorage.getItem('cliente_nome') || localStorage.getItem('nome_cliente') || localStorage.getItem('nome') || localStorage.getItem('nomeCliente') || localStorage.getItem('nome_completo') || '';
}
let meuNome = pegarNome();

// 👇 SE NÃO TEM NOME OU ESTÁ COMO "Cliente", PEDE O NOME UMA VEZ
if(!meuNome || meuNome=='Cliente' || meuNome=='Visitante'){
  let n = prompt('Qual é o teu nome completo?\nEx: Cosme Bento');
  if(n && n.trim()){
    meuNome = n.trim();
    localStorage.setItem('cliente_nome', meuNome);
    localStorage.setItem('nome_cliente', meuNome);
    localStorage.setItem('nome', meuNome);
    // 👇 CORRIGE AS MENSAGENS ANTIGAS QUE ESTAVAM COMO "Cliente"
    setTimeout(async ()=>{
      await db.from('mensagens').update({cliente_nome: meuNome}).eq('cliente_id', String(meuId));
    }, 500);
  } else {
    meuNome = 'Cliente';
  }
}

let ultimoTotal = 0;
let primeiraVez = true;

async function carregar(){
  let r = await db.from('mensagens').select('*').eq('cliente_id', meuId).order('id',{ascending:true});
  let msgs = r.data || [];
  let chat = document.getElementById('chat');
  if(msgs.length===0){
    chat.innerHTML = '<p style="text-align:center;color:#888">Nenhuma mensagem. Escreve a primeira!</p>';
  } else {
    chat.innerHTML = msgs.map(m=>`<div class="msg ${m.remetente=='cliente'?'eu':'admin'}">${m.texto}<br><small style="opacity:.7;font-size:11px">${new Date(m.created_at).toLocaleString('pt-PT')}</small></div>`).join('');
    chat.scrollTop = chat.scrollHeight;
  }
  if(!primeiraVez && msgs.length > ultimoTotal){
    let ultima = msgs[msgs.length-1];
    if(ultima.remetente=='admin'){
      let t = document.getElementById('toastMsg');
      t.style.display='block';
      document.getElementById('badgeCli').style.display='block';
      document.getElementById('badgeCli').textContent = 'Nova mensagem!';
      setTimeout(()=>{ t.style.display='none'; }, 4000);
      try{ if(navigator.vibrate) navigator.vibrate([200,100,200]); }catch(e){}
    }
  }
  primeiraVez = false;
  ultimoTotal = msgs.length;
  document.getElementById('chat').onclick = ()=>{ document.getElementById('badgeCli').style.display='none'; };
}
async function enviar(){
  let t = document.getElementById('texto').value.trim();
  if(!t) return;
  document.getElementById('texto').value='';
  // Atualiza o nome antes de enviar
  meuNome = pegarNome() || meuNome;
  let r = await db.from('mensagens').insert({cliente_id: String(meuId), cliente_nome: meuNome, remetente:'cliente', texto:t});
  if(r.error) alert('Erro: '+r.error.message);
  carregar();
}
carregar(); setInterval(carregar, 2000);
</script></body></html>
