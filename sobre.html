<!DOCTYPE html>
<html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sobre a Loja - Casa Nova</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabase.js"></script>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f1f3f6;padding:0}
.topo{background:#2563eb;color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
.topo a{color:#fff;text-decoration:none;font-weight:700;font-size:14px}
.logo-topo{height:42px;max-width:160px;object-fit:contain;background:transparent;border-radius:0;padding:0;display:none}
.logo-texto{font-weight:800;font-size:18px}
.hero{background:#2563eb;color:#fff;padding:20px 16px 30px;text-align:center}
.hero-logo{width:150px;height:150px;object-fit:contain;background:transparent;border-radius:0;padding:0;display:none;margin:0 auto 12px}
.hero h1{margin:0;font-size:28px}
.hero p{opacity:.9;margin:8px 0 0}
.caixa{background:#fff;margin:12px;border-radius:14px;padding:16px}
.caixa h3{margin:0 0 8px;color:#2563eb}
.caixa p{color:#444;line-height:1.6;margin:0;white-space:pre-line}
.info{line-height:2}
.btn{background:#16a34a;color:#fff;display:block;text-align:center;padding:13px;border-radius:10px;text-decoration:none;font-weight:700;margin:12px}
.btn-azul{background:#2563eb;color:#fff;display:block;text-align:center;padding:13px;border-radius:10px;text-decoration:none;font-weight:700;margin:12px}
</style></head>
<body>
<div class="topo">
  <div style="display:flex;align-items:center;gap:8px">
    <img id="logoTopo" class="logo-topo" src="">
    <span id="logoTexto" class="logo-texto">🏠 Casa Nova</span>
  </div>
  <a href="index.html">← Voltar à Loja</a>
</div>

<div class="hero">
  <img id="logoHero" class="hero-logo" src="">
  <h1>Sobre a Nossa Loja</h1>
  <p>Conhece quem somos</p>
</div>

<div class="caixa"><h3>🏠 Sobre Nós</h3><p id="sobre">A carregar...</p></div>
<div class="caixa"><h3>👁️ A Nossa Visão</h3><p id="visao">A carregar...</p></div>
<div class="caixa"><h3>🎯 A Nossa Missão</h3><p id="missao">A carregar...</p></div>
<div class="caixa"><h3>📍 Endereço & Contactos</h3><div class="info" id="info">
📍 <b>Endereço:</b> <span id="endereco">-</span><br>
📞 <b>Telefone:</b> <span id="telefone">-</span><br>
💬 <b>WhatsApp:</b> <span id="whatsapp">-</span><br>
🕒 <b>Horário:</b> <span id="horario">-</span><br>
📧 <b>Email:</b> <span id="email">-</span>
</div></div>

<a class="btn" id="btnWpp" href="#" target="_blank">💬 Falar no WhatsApp</a>
<a class="btn-azul" href="index.html">🛍️ Ver Produtos</a>

<script>
async function carregar(){
  const r=await db.from('loja_config').select('*').eq('id',1).maybeSingle();
  let c=r.data||{};
  // LOGOTIPO - AGORA APARECE
  if(c.logo_url){
    let lt=document.getElementById('logoTopo');
    lt.src=c.logo_url; lt.style.display='block';
    document.getElementById('logoTexto').style.display='none';
    let lh=document.getElementById('logoHero');
    lh.src=c.logo_url; lh.style.display='block';
  }
  document.getElementById('sobre').textContent=c.sobre||'Bem-vindo à Casa Nova! A tua loja de confiança em Luanda.';
  document.getElementById('visao').textContent=c.visao||'Ser a melhor loja de eletrodomésticos e telemóveis em Angola, com qualidade e bons preços.';
  document.getElementById('missao').textContent=c.missao||'Levar produtos de qualidade a todas as famílias, com atendimento rápido e honesto.';
  document.getElementById('endereco').textContent=c.endereco||'Luanda, Angola';
  document.getElementById('telefone').textContent=c.telefone||'-';
  document.getElementById('whatsapp').textContent=c.whatsapp||'-';
  document.getElementById('horario').textContent=c.horario||'Seg - Sáb: 08h00 - 19h00';
  document.getElementById('email').textContent=c.email_loja||'-';
  if(c.whatsapp){
    let num=c.whatsapp.replace(/\D/g,'');
    document.getElementById('btnWpp').href='https://wa.me/'+num+'?text=Olá Casa Nova, vim da página Sobre';
  }
}
carregar();
</script></body></html>
